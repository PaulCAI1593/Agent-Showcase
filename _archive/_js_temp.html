<!-- ============ JAVASCRIPT ============ -->
<script>
// ==================== PARTICLE CANVAS (HERO) ====================
(function(){
  var canvas = document.getElementById('hero-canvas');
  if(!canvas) return;
  var ctx = canvas.getContext('2d');
  var W, H, particles = [];
  function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  function Particle(){ this.reset(); }
  Particle.prototype.reset = function(){
    this.x = Math.random()*W;
    this.y = Math.random()*H;
    this.size = Math.random()*2.5+0.5;
    this.speedX = (Math.random()-0.5)*0.4;
    this.speedY = (Math.random()-0.5)*0.3 - 0.2;
    this.opacity = Math.random()*0.6+0.1;
    this.isGold = Math.random() > 0.5;
    this.isSymbol = Math.random() > 0.85;
    this.life = Math.random()*200+100;
    this.maxLife = this.life;
  };
  Particle.prototype.update = function(){
    this.x += this.speedX;
    this.y += this.speedY;
    this.life--;
    if(this.life<=0 || this.x<-20 || this.x>W+20 || this.y<-20 || this.y>H+20) this.reset();
  };
  Particle.prototype.draw = function(){
    var alpha = this.opacity * (this.life/this.maxLife);
    if(this.isSymbol){
      ctx.font = (10+this.size*3)+'px sans-serif';
      ctx.fillStyle = this.isGold ? 'rgba(212,175,55,'+alpha+')' : 'rgba(247,147,26,'+alpha+')';
      ctx.fillText(this.isGold ? '\u2726' : '\u20BF', this.x, this.y);
    } else {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
      ctx.fillStyle = this.isGold ? 'rgba(212,175,55,'+alpha+')' : 'rgba(247,147,26,'+alpha+')';
      ctx.fill();
    }
  };
  for(var i=0;i<120;i++) particles.push(new Particle());
  function animate(){
    ctx.clearRect(0,0,W,H);
    particles.forEach(function(p){p.update();p.draw();});
    requestAnimationFrame(animate);
  }
  animate();
})();

// ==================== GSAP + SCROLLTRIGGER ====================
gsap.registerPlugin(ScrollTrigger);

// Reveal on scroll
document.querySelectorAll('.reveal').forEach(function(el){
  gsap.fromTo(el,{opacity:0,y:40},{opacity:1,y:0,duration:.8,ease:'power2.out',
    scrollTrigger:{trigger:el,start:'top 85%',toggleActions:'play none none none'}
  });
});

// Nav dots
var sections = document.querySelectorAll('.section');
var dots = document.querySelectorAll('.nav-dot');
sections.forEach(function(s,i){
  ScrollTrigger.create({trigger:s,start:'top center',end:'bottom center',
    onEnter:function(){updateDots(i)},onEnterBack:function(){updateDots(i)}
  });
});
function updateDots(idx){
  dots.forEach(function(d){d.classList.remove('active')});
  if(dots[idx]) dots[idx].classList.add('active');
}
dots.forEach(function(d){
  d.addEventListener('click',function(){
    var idx=parseInt(d.dataset.section);
    sections[idx].scrollIntoView({behavior:'smooth'});
  });
});

// ==================== HERO ANIMATIONS ====================
gsap.from('.hero-overline',{opacity:0,y:20,duration:1,delay:.3});
gsap.from('.hero-title',{opacity:0,y:30,duration:1.2,delay:.5});
gsap.from('.hero-subtitle',{opacity:0,y:20,duration:1,delay:.9});
gsap.from('.scroll-indicator',{opacity:0,duration:1,delay:1.5});

// ==================== COUNTERS ====================
function animateCounter(el, target, duration){
  var startTime=performance.now();
  function update(currentTime){
    var elapsed=currentTime-startTime;
    var progress=Math.min(elapsed/duration,1);
    var eased=1-Math.pow(1-progress,3);
    var current=Math.round(target*eased);
    el.textContent=current.toLocaleString();
    if(progress<1) requestAnimationFrame(update);
  }
  requestAnimationFrame(update);
}
ScrollTrigger.create({
  trigger:'#numbers',start:'top 70%',
  onEnter:function(){
    animateCounter(document.getElementById('goldCounter'),4860,2000);
    animateCounter(document.getElementById('btcCounter'),79455,2000);
    drawSparklines();
  },once:true
});

// ==================== SPARKLINES ====================
function drawSparklines(){
  var goldData=[120,250,380,420,490,520,480,400,350,300,280,260,250,260,290,320,350,380,420,460,500,530,550];
  drawSparkline('goldSparkline',goldData,'#D4AF37','#F0D060');
  var btcData=[400,480,520,500,450,380,320,280,250,230,200,180,160,150,155,170,200,240,300,370,420,480,500];
  drawSparkline('btcSparkline',btcData,'#F7931A','#FFB84D');
}
function drawSparkline(id,data,c1,c2){
  var container=document.getElementById(id);
  if(!container) return;
  var w=container.offsetWidth||300, h=80;
  var max=Math.max.apply(null,data), min=Math.min.apply(null,data);
  var points=data.map(function(v,i){
    var x=(i/(data.length-1))*w;
    var y=h-10-((v-min)/(max-min))*(h-20);
    return x+','+y;
  });
  var pathD='M'+points.join(' L');
  var areaD=pathD+' L'+w+','+h+' L0,'+h+' Z';
  container.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" width="100%" height="100%">'
    +'<defs><linearGradient id="grad_'+id+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="'+c1+'" stop-opacity="0.3"/>'
    +'<stop offset="100%" stop-color="'+c1+'" stop-opacity="0"/>'
    +'</linearGradient></defs>'
    +'<path d="'+areaD+'" fill="url(#grad_'+id+')"/>'
    +'<path d="'+pathD+'" fill="none" stroke="'+c1+'" stroke-width="2" stroke-linecap="round"/>'
    +'<circle cx="'+w+'" cy="'+points[points.length-1].split(',')[1]+'" r="3" fill="'+c2+'"/>'
    +'</svg>';
}

// ==================== TOGGLE (A/B COMPARISON) ====================
var toggleSwitch = document.getElementById('toggleSwitch');
var panelGold = document.getElementById('panelGold');
var panelBtc = document.getElementById('panelBtc');
var togGold = document.getElementById('togGold');
var togBtc = document.getElementById('togBtc');
var isBtc = false;
if(toggleSwitch){
  toggleSwitch.addEventListener('click', function(){
    isBtc = !isBtc;
    toggleSwitch.classList.toggle('btc-mode', isBtc);
    togGold.classList.toggle('active-gold', !isBtc);
    togGold.classList.toggle('active-btc', isBtc);
    togBtc.classList.toggle('active-btc', isBtc);
    togBtc.classList.toggle('active-gold', !isBtc);
    panelGold.classList.toggle('active', !isBtc);
    panelBtc.classList.toggle('active', isBtc);
    if(isBtc){
      togGold.style.color = '#555';
      togBtc.style.color = '#F7931A';
    } else {
      togGold.style.color = '#D4AF37';
      togBtc.style.color = '#555';
    }
    drawComparisonChart(isBtc ? 'btc' : 'gold');
  });
  togGold.addEventListener('click', function(){ if(isBtc) toggleSwitch.click(); });
  togBtc.addEventListener('click', function(){ if(!isBtc) toggleSwitch.click(); });
}

// Draw comparison chart
function drawComparisonChart(type){
  var svg = document.getElementById(type==='btc' ? 'chartBtc' : 'chartGold');
  if(!svg) return;
  var w=800, h=200;
  var data, color;
  if(type==='gold'){
    data=[4200,4500,4900,5300,5626,5400,5100,4800,4500,4200,3942,4100,4300,4500,4700,4860];
    color='#D4AF37';
  } else {
    data=[95000,105000,115000,126000,120000,110000,95000,80000,70000,62000,58000,60000,65000,70000,75000,79455];
    color='#F7931A';
  }
  var max=Math.max.apply(null,data), min=Math.min.apply(null,data);
  var pad=20;
  var points=data.map(function(v,i){
    var x=pad+(i/(data.length-1))*(w-2*pad);
    var y=pad+(1-(v-min)/(max-min))*(h-2*pad);
    return x+','+y;
  });
  var pathD='M'+points.join(' L');
  var areaD=pathD+' L'+(w-pad)+','+(h-pad)+' L'+pad+','+(h-pad)+' Z';

  var athIdx = type==='gold' ? 4 : 3;
  var lowIdx = type==='gold' ? 10 : 11;

  var html = '<defs><linearGradient id="cmpGrad" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0%" stop-color="'+color+'" stop-opacity="0.25"/>'
    +'<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/>'
    +'</linearGradient></defs>'
    +'<path d="'+areaD+'" fill="url(#cmpGrad)"/>'
    +'<path d="'+pathD+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">'
    +'<animate attributeName="stroke-dashoffset" from="2000" to="0" dur="1.5s" fill="freeze"/>'
    +'<animate attributeName="stroke-dasharray" from="0,2000" to="2000,0" dur="1.5s" fill="freeze"/>'
    +'</path>'
    +'<circle cx="'+points[points.length-1].split(',')[0]+'" cy="'+points[points.length-1].split(',')[1]+'" r="5" fill="'+color+'"/>'
    +'<circle cx="'+points[points.length-1].split(',')[0]+'" cy="'+points[points.length-1].split(',')[1]+'" r="9" fill="none" stroke="'+color+'" stroke-opacity="0.3" stroke-width="2">'
    +'<animate attributeName="r" from="5" to="12" dur="1.5s" repeatCount="indefinite"/>'
    +'<animate attributeName="stroke-opacity" from="0.5" to="0" dur="1.5s" repeatCount="indefinite"/>'
    +'</circle>'
    +'<text x="'+points[athIdx].split(',')[0]+'" y="'+(parseFloat(points[athIdx].split(',')[1])-12)+'" fill="'+color+'" font-size="11" text-anchor="middle" font-weight="600">ATH</text>'
    +'<text x="'+points[lowIdx].split(',')[0]+'" y="'+(parseFloat(points[lowIdx].split(',')[1])+18)+'" fill="#888" font-size="10" text-anchor="middle">LOW</text>';

  svg.innerHTML = html;
}

// Initial chart draw
setTimeout(function(){ drawComparisonChart('gold'); }, 500);

// ==================== GAUGES ====================
function drawGauge(svgId, pct, color){
  var svg = document.getElementById(svgId);
  if(!svg) return;
  var cx=60, cy=60, r=45;
  var startAngle = Math.PI;
  var endAngle = startAngle + (pct/100)*Math.PI;
  var x1=cx+r*Math.cos(startAngle), y1=cy+r*Math.sin(startAngle);
  var x2=cx+r*Math.cos(endAngle), y2=cy+r*Math.sin(endAngle);
  var large = pct>50?1:0;
  var bgD='M'+(cx-r)+','+cy+' A'+r+','+r+' 0 0,1 '+(cx+r)+','+cy;
  var fgD='M'+x1+','+y1+' A'+r+','+r+' 0 '+large+',1 '+x2+','+y2;
  svg.innerHTML='<path d="'+bgD+'" fill="none" stroke="#222" stroke-width="8" stroke-linecap="round"/>'
    +'<path d="'+fgD+'" fill="none" stroke="'+color+'" stroke-width="8" stroke-linecap="round">'
    +'<animate attributeName="stroke-dashoffset" from="200" to="0" dur="1s" fill="freeze"/>'
    +'</path>';
}
setTimeout(function(){
  drawGauge('gaugeGold',37,'#D4AF37');
  drawGauge('gaugeBtc',100,'#F7931A');
}, 800);

// ==================== RINGS ====================
function drawRing(svgId, pct, color){
  var svg = document.getElementById(svgId);
  if(!svg) return;
  var cx=40, cy=40, r=30;
  var circumference = 2*Math.PI*r;
  var offset = circumference*(1-pct);
  svg.innerHTML='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="#222" stroke-width="6"/>'
    +'<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="6" '
    +'stroke-dasharray="'+circumference+'" stroke-dashoffset="'+circumference+'" stroke-linecap="round" '
    +'transform="rotate(-90 '+cx+' '+cy+')">'
    +'<animate attributeName="stroke-dashoffset" from="'+circumference+'" to="'+offset+'" dur="1.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>'
    +'</circle>'
    +'<text x="'+cx+'" y="'+(cy+5)+'" fill="'+color+'" font-size="13" text-anchor="middle" font-weight="700">'+Math.round(pct*100)+'</text>';
}
setTimeout(function(){
  drawRing('ringGold',0.41,'#D4AF37');
  drawRing('ringBtc',0.74,'#F7931A');
}, 900);

// ==================== TIMELINE TOGGLE ====================
function toggleDetail(node){
  var item = node.closest('.tl-item');
  var detail = item.querySelector('.tl-detail');
  var allDetails = document.querySelectorAll('.tl-detail');
  allDetails.forEach(function(d){ if(d!==detail) d.classList.remove('open'); });
  detail.classList.toggle('open');
  node.classList.toggle('active');
}

// ==================== BAR COMPARISON ANIMATION ====================
ScrollTrigger.create({
  trigger:'.bar-comparison',start:'top 80%',
  onEnter:function(){
    document.querySelectorAll('.bar-fill').forEach(function(bar){
      var w = bar.dataset.width;
      setTimeout(function(){ bar.style.width = w+'%'; }, 200);
    });
  },once:true
});

// ==================== DASHBOARD CHARTS ====================
ScrollTrigger.create({
  trigger:'#dashboard',start:'top 70%',
  onEnter:function(){ drawDashboardCharts(); },once:true
});

function drawDashboardCharts(){
  // Gold ETF Monthly Inflows (bar chart)
  var goldBars = document.getElementById('dashGoldEtfs');
  if(goldBars){
    var months=['Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug'];
    var values=[3.2,4.1,5.5,6.8,19.0,8.2,5.1,4.3,3.8,3.5,4.0,5.2];
    var max=20, bw=28, gap=4, startX=20;
    var html='';
    months.forEach(function(m,i){
      var x=startX+i*(bw+gap);
      var h2=(values[i]/max)*110;
      var y=125-h2;
      var c = i===4 ? '#D4AF37' : '#D4AF3788';
      html+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+h2+'" rx="3" fill="'+c+'">'
        +'<animate attributeName="height" from="0" to="'+h2+'" dur="0.8s" fill="freeze" begin="0.'+i+'s"/>'
        +'<animate attributeName="y" from="125" to="'+y+'" dur="0.8s" fill="freeze" begin="0.'+i+'s"/>'
        +'</rect>'
        +'<text x="'+(x+bw/2)+'" y="138" fill="#555" font-size="9" text-anchor="middle">'+m+'</text>';
      if(i===4) html+='<text x="'+(x+bw/2)+'" y="'+(y-4)+'" fill="#D4AF37" font-size="9" text-anchor="middle" font-weight="600">$19B</text>';
    });
    goldBars.innerHTML=html;
  }

  // BTC ETF Cumulative (area chart)
  var btcArea = document.getElementById('dashBtcEtfs');
  if(btcArea){
    var pts=[0,2,5,8,12,16,20,25,28,32,36,40,43,46,48,50,51,53];
    var w=400, h=130, pad=10;
    var max=55;
    var coords=pts.map(function(v,i){
      var x=pad+(i/(pts.length-1))*(w-2*pad);
      var y=h-pad-(v/max)*(h-2*pad);
      return x+','+y;
    });
    var pathD='M'+coords.join(' L');
    var areaD=pathD+' L'+(w-pad)+','+(h-pad)+' L'+pad+','+(h-pad)+' Z';
    btcArea.innerHTML='<defs><linearGradient id="btcGrad" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0%" stop-color="#F7931A" stop-opacity="0.3"/>'
      +'<stop offset="100%" stop-color="#F7931A" stop-opacity="0"/>'
      +'</linearGradient></defs>'
      +'<path d="'+areaD+'" fill="url(#btcGrad)"/>'
      +'<path d="'+pathD+'" fill="none" stroke="#F7931A" stroke-width="2"/>'
      +'<circle cx="'+coords[coords.length-1].split(',')[0]+'" cy="'+coords[coords.length-1].split(',')[1]+'" r="4" fill="#F7931A"/>'
      +'<text x="'+(w-pad-5)+'" y="'+(h-pad-8)+'" fill="#F7931A" font-size="10" text-anchor="end">$53B+</text>';
  }

  // Central Bank Gold (horizontal bar chart)
  var cbank = document.getElementById('dashCbank');
  if(cbank){
    var years=['2021','2022','2023','2024','2025','2026*'];
    var tonnes=[463,1082,1037,1045,863,244];
    var maxT=1100;
    var html='';
    years.forEach(function(y,i){
      var barH=14;
      var y2=i*(barH+6)+8;
      var w2=(tonnes[i]/maxT)*320;
      var c = i===4 ? '#D4AF37' : i===5 ? '#F0D060' : '#D4AF3766';
      html+='<text x="30" y="'+(y2+11)+'" fill="#888" font-size="10" text-anchor="end">'+y+'</text>'
        +'<rect x="35" y="'+y2+'" width="0" height="'+barH+'" rx="3" fill="'+c+'">'
        +'<animate attributeName="width" from="0" to="'+w2+'" dur="0.8s" fill="freeze" begin="0.'+i+'s"/>'
        +'</rect>'
        +'<text x="'+(35+w2+6)+'" y="'+(y2+11)+'" fill="#aaa" font-size="10">'+tonnes[i]+'t</text>';
    });
    cbank.innerHTML=html;
  }

  // BTC/Gold Correlation (line chart)
  var corr = document.getElementById('dashCorrelation');
  if(corr){
    var corrData=[0.05,0.08,0.12,0.10,0.15,0.18,0.14,0.11,0.16,0.20,0.18,0.22,0.25,0.23,0.28,0.30,0.27,0.32,0.35,0.38,0.41];
    var w=400, h=130, pad=15;
    var max=0.5;
    var coords=corrData.map(function(v,i){
      var x=pad+(i/(corrData.length-1))*(w-2*pad);
      var y=h-pad-(v/max)*(h-2*pad);
      return x+','+y;
    });
    var pathD='M'+coords.join(' L');
    var areaD=pathD+' L'+(w-pad)+','+(h-pad)+' L'+pad+','+(h-pad)+' Z';
    corr.innerHTML='<defs><linearGradient id="corrGrad" x1="0" y1="0" x2="0" y2="1">'
      +'<stop offset="0%" stop-color="#F7931A" stop-opacity="0.2"/>'
      +'<stop offset="100%" stop-color="#D4AF37" stop-opacity="0.05"/>'
      +'</linearGradient></defs>'
      +'<path d="'+areaD+'" fill="url(#corrGrad)"/>'
      +'<path d="'+pathD+'" fill="none" stroke="#F7931A" stroke-width="2"/>'
      +'<line x1="'+pad+'" y1="'+(h-pad-(0.41/max)*(h-2*pad))+'" x2="'+(w-pad)+'" y2="'+(h-pad-(0.41/max)*(h-2*pad))+'" stroke="#D4AF3766" stroke-dasharray="4,4"/>'
      +'<circle cx="'+coords[coords.length-1].split(',')[0]+'" cy="'+coords[coords.length-1].split(',')[1]+'" r="4" fill="#F7931A"/>'
      +'<text x="'+(w-pad-5)+'" y="'+(h-pad-12)+'" fill="#F7931A" font-size="10" text-anchor="end" font-weight="600">0.41 ATH</text>';
  }
}
</script>
