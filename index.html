<style>/* 数字与拉丁文用自托管衬线（与研究类作品页同一套字） */ @font-face{font-family:'Newsreader';src:url('assets/vendor/fonts/newsreader-latin-300-600.woff2') format('woff2');

  -webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.6}a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}/* ══ 柜面 ══════════════════════════════════════════════ */ /* ══ 封面（海报）═════════════════════════════════════════════ 封面只做一件事：让人想往下翻。所以只留一个主导视觉（本期代表作）、 一句主张、超大字号。工具（检索/筛选）全部下沉到柜子里。 高度撑满一屏，柜子在下一屏 —— 像一本杂志的封面与内页。 */ .cover{

}.lw-row{display:block;break-inside:avoid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lw-v{font-family:var(--serif);font-variant-numeric:tabular-nums;color:rgba(240,194,127,.52);margin-right:7px}.lw-row.hot .lw-v{color:rgba(240,194,127,.92)}.lw-row.hot{color:rgba(255,255,255,.46)}.lw-d{color:rgba(255,255,255,.1);margin-right:6px;font-size:10.5px}/* 封面上层的可读性护栏：标题所在区域压暗 */ .cover-veil{

  font-variant-numeric:tabular-nums;white-space:nowrap}/* 底部：追踪线条目（像杂志的目录条）+ 下翻提示 */ .cover-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap;

  color:var(--t3);font-family:var(--serif);white-space:nowrap}.cover-scroll svg{width:15px;height:15px;animation:bob 2.4s ease-in-out infinite}0%,100%{transform:translateY(-2px);opacity:.7}50%{transform:translateY(3px);opacity:1}/* 封面入场：唯一的一次性编排（不是每屏同样的入场） */ .cover-issue,.cover-title,.cover-rule,.cover-lede,.cover-figs,.cover-plate,.cover-foot{
  opacity:0;transform:translateY(16px);
}.cover-in .cover-issue{opacity:1;transform:none;transition:opacity .6s var(--ease),transform .7s var(--ease)}.cover-in .cover-title{opacity:1;transform:none;transition:opacity .6s var(--ease) .08s,transform .7s var(--ease) .08s}.cover-in .cover-rule{opacity:1;transform:none;transition:opacity .6s var(--ease) .3s,transform .8s var(--ease) .3s}.cover-in .cover-lede{opacity:1;transform:none;transition:opacity .6s var(--ease) .36s,transform .7s var(--ease) .36s}.cover-in .cover-figs{opacity:1;transform:none;transition:opacity .6s var(--ease) .46s,transform .7s var(--ease) .46s}.cover-in .cover-plate{opacity:1;transform:none;transition:opacity .7s var(--ease) .2s,transform .8s var(--ease) .2s}.cover-in .cover-foot{opacity:1;transform:none;transition:opacity .7s var(--ease) .58s,transform .8s var(--ease) .58s}/* 搜索：档案柜的主控制 */ .search{position:relative;flex:1 1 320px;max-width:420px;min-width:260px}.search--bar{flex:0 1 300px;min-width:190px;max-width:300px}.search--bar input{padding:7px 12px 7px 38px;font-size:13.5px;border-radius:980px}.search--bar svg{left:13px;width:14px;height:14px}.search-hint--bar{max-width:1560px;margin:0 auto;padding:10px 34px 0;font-size:12px;color:var(--t3)}.search-hint--bar:empty{display:none}.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}.search input{
  width:100%;padding:13px 15px 13px 44px;border-radius:11px;

  font-family:var(--sans);font-size:15px;transition:border-color .2s,background .2s;
}.search input::placeholder{color:var(--t3)}.search input:focus{outline:none;border-color:var(--border-h);background:var(--glass-h)}.search-hint{font-size:12px;color:var(--t3);margin-top:8px;min-height:16px}.search-hint b{color:var(--gold);font-weight:500}from{height:0;opacity:0}/* 抽屉标签牌：黄铜拉手 */ /* 抽屉样式已随变体 C 移除 */ ════════ 立意：**不展示"这里有 104 个作品"，展示一条断言凭什么可信。** 封面 = 一张证据单（单据式结构：抬头 / 主值 / 溯源链 / 核验章）， 满屏一列。1001 条这样的记录在下面。 结构与其它变体完全不同：没有左右分栏、没有图阵列、没有抽屉。 */ .cover .ledger-wall{display:none}.cover .cover-veil{display:none}.cover .cover-plate{display:none}/* 证据单 */ .ev-slip{

  font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-weight:600;margin-right:6px}.ev-n span{font-size:12.5px;color:var(--t3);letter-spacing:.04em;margin-right:12px}════════════════════════════════════════════ */ /* ══ 封面定稿：一叠数据上的一张单据 ═══════════════════════ 层级（底→顶）： ① 账簿墙 —— 铺满全屏的 1001 条断言，压暗，像一张铺满数据的桌面 ② 证据单 —— 实体单据（不透明表面 + 投影 + 流水号） ③ 数值 —— 大到占据主体 ④ 印章 —— 压在单据右上（像真盖上去的章） 全幅出血：无页边距，像一张被扫描放大到墙上的文件。 */ .cover{padding:0}.cover .ledger-wall{opacity:.30;filter:saturate(.55)}.cover .cover-veil{background:linear-gradient(180deg,rgba(5,5,8,.78) 0%,rgba(5,5,8,.52) 44%,rgba(5,5,8,.92) 100%)}.cover .cover-inner{max-width:none;padding:0}.cover .cover-issue{padding:15px 30px;border-bottom:1px solid var(--border);

}.cover .ev-main{padding:32px 34px 26px;position:relative;flex:0 0 auto}.cover .ev-val{font-size:clamp(56px,10vw,142px);line-height:.94;letter-spacing:-.045em;
  font-weight:600;color:var(--gold)}.cover .ev-label{font-size:clamp(19px,2.3vw,30px);margin-top:14px;max-width:20em}.cover .ev-rows{flex:1 1 auto;align-content:start}.cover .ev-seal{position:absolute;right:32px;top:26px;width:104px;height:104px}.cover .ev-foot{margin-top:auto;padding:14px 30px}.cover .cover-foot{padding:16px 30px 24px;background:rgba(5,5,8,.55);backdrop-filter:blur(6px)}/* ══ 封面：影像 ════════════════════════════════════════════ 立意补正：作品自己的 104 张截图就是这份档案的影像记录 —— 封面该由它们构成，不该是一张写满字的单据。 层级：漂移的影像场（底） → 聚焦大图（中） → 极少的字（前景） */ .cover .ledger-wall{display:none}.cover-field{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}.cover-field img{

}0%{transform:translate3d(0,0,0) rotate(var(--rot)) scale(1)}50%{transform:translate3d(var(--dx),var(--dy),0) rotate(calc(var(--rot) + 1.4deg)) scale(1.05)}100%{transform:translate3d(0,0,0) rotate(var(--rot)) scale(1)}.cover-focus{position:absolute;z-index:2;transition:opacity .5s var(--ease),filter .5s var(--ease)}.cover-focus a{display:block;line-height:0}.cover-focus img{

}from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.12) translate(-1.2%,-1.6%)}.cover-focus.fade{opacity:0}.cover-veil{background:
  linear-gradient(100deg,rgba(5,5,8,.96) 0%,rgba(5,5,8,.90) 22%,rgba(5,5,8,.42) 42%,
             rgba(5,5,8,.04) 58%,rgba(5,5,8,.12) 100%),
  linear-gradient(to top,rgba(5,5,8,.92) 0%,rgba(5,5,8,.30) 18%,rgba(5,5,8,0) 42%)}.cover-inner{position:relative;z-index:3}.cover .cover-body{display:block;padding:0;min-height:calc(100vh - 300px)}.cover #ev-tail{position:relative}.cover #ev-tail::before{content:'';position:absolute;left:-48px;top:-40px;

<script>
/* ══════════════════════════════════════════════════════════
   档案柜 —— 按月份归档，抽屉可拉开
   数据全部来自 manifest.json（运行时 fetch），file:// 回退到内嵌快照
   ══════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let DATA=[], ALL=[], STATS={}, BY_FILE={}, MONTHS=[], openSet=new Set(), Q='', MODE='works';

function normalize(src){
  const out=[];
  for(const g of ['research','creative']){
    for(const it of (src[g]||[])){
      out.push({
        file:it.file, thumb:it.thumb||'', title:it.title||'', date:it.date||'',
        type:it.type||g, tags:it.highlights||it.tags||[], desc:it.description||it.desc||'',
        beat:it.beat||'',
        // ⚠️ 两种数据源的 claims 形状不同：
        //    manifest.json  → {value, label, quote}
        //    EMBEDDED 快照  → {v, l}（为压缩体积）
        //    客户端同时吃两种 —— 否则 HTTP 路径下断言全空白（实测）。
        claims:(it.claims||[]).map(c=>({
          v:c.v!=null?c.v:(c.value!=null?c.value:''),
          l:c.l!=null?c.l:(c.label!=null?c.label:''),
          q:c.quote||c.q||'',
          s:c.s!=null?c.s:(c.source||'')
        }))
      });
    }
  }
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}

/* ── 柜面数字 ── */
function renderFigs(){
  const c=(STATS.claims||{});
  // 元素可能已被移除（封面重构后这几个数字块不再存在）—— 必须判空，
  // 否则一次 null 赋值就让整个 boot() 中断（页面白屏）
  const set=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent=v;};
  set('fig-works',DATA.length);
  set('fig-months',MONTHS.length);
  set('fig-lines',(c.dossier||[]).length);
  set('fig-claims',c.total||0);
  set('cov-n',c.total||0);
  const f=$('#foot-date'); if(f) f.textContent=STATS.generated?('更新于 '+STATS.generated):'';
}

// 账簿墙：把全部已验证断言铺成封面背景
// 每一行都是真实数据 —— 封面因此是档案本身，而不是关于档案的图。
// 确定性哈希：同一串内容永远得到同一个数。
// ⚠️ 不能用 Math.random() —— 那会让每次刷新封面都不一样，
// 而且 HTTP 与 file:// 两条路径会给出**不同**的封面。海报必须是稳定的。
function hashOf(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}
  return (h>>>0);
}

function renderLedgerWall(){
  const wall=document.getElementById('ledger-wall');
  if(!wall) return;
  const rows=[];
  DATA.forEach(it=>{
    (it.claims||[]).forEach(c=>{
      const key=c.v+'|'+c.l;
      // 按内容哈希挑 ~10% 做金色醒目行 —— 制造节奏而不是均匀噪声
      const hot=(hashOf(key)%100)<11;
      rows.push({key:key, hot:hot,
        html:'<span class="lw-row'+(hot?' hot':'')+'">'+
          '<span class="lw-v">'+esc(c.v)+'</span>'+esc(c.l)+'</span>'});
    });
  });
  // 打散顺序（按作品分组会看出竖向条带）—— 用哈希排序，同样是确定性的
  rows.sort((a,b)=>hashOf('sort'+a.key)-hashOf('sort'+b.key));
  wall.innerHTML=rows.map(r=>r.html).join('');
}


// 变体 C：月份抽屉（档案柜正视）
// 每个抽屉 = 一个月份；抽屉里立着该月作品的「文件侧边」——


// 封面影像：漂移的场 + 聚焦的大图
// 位置/大小/方向全部由**内容哈希**决定 → 确定性，两条路径一致，刷新不变
function buildField(){
  const field=document.getElementById('cover-field');
  if(!field) return;
  const imgs=ALL.filter(i=>i.thumb);
  if(!imgs.length){ field.innerHTML=''; return; }
  // ⚠️ JS 里 `>>>` 的优先级**低于** `%`：`h >>> 13 % 24` 实际是 `h >>> (13%24)`
  //    = `h >>> 13` —— 那个 `% 24` 根本没生效，于是宽度变成 276581vw、
  //    透明度 708025，整场飞出屏幕（实测 52/52 张都加载了却看不见）。
  //    位移与取模混算必须显式加括号。
  //
  // 分布：**网格分层 + 格内抖动**（而不是纯哈希撒点）。
  // 纯哈希会结块（实测中间挤成一团），读着像事故；分层后像一面有节奏的屏幕墙。
  // 小屏减量：手机上 60 张漂移图既费电又看不清
  const small = window.matchMedia('(max-width:760px)').matches;
  const COLS = small ? 6 : 10, ROWS = small ? 4 : 6;
  const cells=[];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) cells.push({r,c});
  // 用哈希给格子排序 → 选中的格子均匀铺开
  cells.sort((a,b)=>hashOf('c'+a.r+'-'+a.c)-hashOf('c'+b.r+'-'+b.c));
  const picked=imgs.filter((_,k)=>k%Math.max(1,Math.floor(imgs.length/(COLS*ROWS)))===0)
                  .slice(0,COLS*ROWS);
  const cw=100/COLS, ch=100/ROWS;
  // 封面离屏 → 暂停漂移（60 个元素常驻动画 + 常驻 will-change 很耗电）
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{
      field.classList.toggle('idle', !es[0].isIntersecting);
    },{threshold:0});
    io.observe(field);
  }
  field.innerHTML=picked.map((it,k)=>{
    const h=hashOf(it.file);
    const cell=cells[k%cells.length];
    // 格内抖动（±0.35 格）—— 有机但不结块
    const jx=(((h>>>5)%70)-35)/100*cw, jy=(((h>>>11)%70)-35)/100*ch;
    let x=cell.c*cw+cw/2+jx, y=cell.r*ch+ch/2+jy;
    // 只避开**左侧文字区**（x<32% 且 y 12%~58%）：这些挪到底部带。
    // 右侧（聚焦图后面）也放 —— 聚焦图不透明，那部分看不见，但让分布更自然。
    if(x<32 && y>12 && y<58){ x=4+((h>>>3)%28); y=62+((h>>>17)%32); }
    if(x<5) x=5; if(x>95) x=95; if(y<3) y=3; if(y>93) y=93;
    const w=7+((h>>>13)%13), rot=(((h>>>19)%60)-30)/12;
    const dx=((h>>>23)%90)-45, dy=((h>>>29)%90)-45;
    const dur=26+((h>>>33)%40);
    const op=.17+((h>>>37)%26)/100;
    return `<img src="${esc(it.thumb)}" alt="" decoding="async"
      style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%;width:${w}vw;height:${w*0.64}vh;
             --rot:${rot.toFixed(1)}deg;--dx:${dx}px;--dy:${dy}px;animation-duration:${dur}s;
             animation-delay:-${((h>>>41)%dur)}s;opacity:${op.toFixed(2)}">`;
  }).join('');
}

// 聚焦大图：每 6 秒换一件主打，交叉淡入 + 缓慢推近
let focusTimer=null, focusIdx=0, focusList=[];
function renderFocus(){
  const box=document.getElementById('cover-focus');
  if(!box) return;
  focusList=ALL.filter(i=>i.thumb).slice(0,12);
  if(!focusList.length) return;
  const paint=()=>{
    const it=focusList[focusIdx%focusList.length];
    const cl=(it.claims&&it.claims[0])||null;
    box.classList.add('fade');
    setTimeout(()=>{
      box.innerHTML=`<a href="${esc(it.file)}" title="${esc(it.title)}" aria-label="${esc(it.title)}">`
        +`<img src="${esc(it.thumb)}" alt=""></a>`;
      box.style.left='57%'; box.style.top='13%';
      box.style.width='37vw'; box.style.height='56vh';
      box.classList.remove('fade');
      // 说明文字跟着换
      const tail=document.getElementById('ev-tail');
      if(tail){
        const c=(STATS.claims||{});
        tail.innerHTML=`<p style="max-width:34em"><b style="color:var(--t1)">${esc(it.title)}</b><br>
          ${cl?`<span style="color:var(--gold);font-family:var(--serif);font-size:1.25em">${esc(cl.v)}</span> <span>${esc(cl.l)}</span> · 引用已逐字回查原文`:'本篇暂无已验证断言'}
          <br><span style="color:var(--t3);font-size:.82em">${esc(it.date)} · ${esc(it.beat||'未归类')}</span></p>`;
      }
    }, 850);
  };
  paint();
  if(focusTimer) clearInterval(focusTimer);
  focusTimer=setInterval(()=>{ focusIdx++; paint(); }, 6000);
}

// 变体 E：证据单 —— 一条断言 + 它的完整溯源链
// 立意：不展示"这里有 104 个作品"，展示**一条断言凭什么可信**。
function renderEvidenceSlip(feat){
  const slip=document.getElementById('ev-slip');
  if(!slip || !feat) return;
  const c=(STATS.claims||{});
  // 轮换池 = **全档案最近**的已验证断言（不是只在一件作品里转）。
  // 这样新作品的断言会自动出现在封面上 —— 封面因此是活的，且随档案更新。
  // 优先带引证出处的（证据链才完整），其次按作品日期倒序。
  const pool=[];
  DATA.slice().sort((a,b)=>b.date.localeCompare(a.date)).forEach(it=>{
    (it.claims||[]).forEach(cl=>{ pool.push({it:it, c:cl}); });
  });
  const withSrc=pool.filter(x=>x.c.s), without=pool.filter(x=>!x.c.s);
  const seqPool=(withSrc.length>=6?withSrc:pool).concat(without).slice(0,14);
  const seq=seqPool.length?seqPool.map(x=>x.c):[null];
  const seqOwner=seqPool.length?seqPool.map(x=>x.it):[feat];
  let idx=0;
  const serial='№ '+feat.date.replace(/-/g,'')+'-'+String(idx+1).padStart(2,'0');
  function rowsFor(cl, owner){
    owner=owner||feat;
    const rows=[];
    if(cl&&cl.s) rows.push(['出处', cl.s]);   // 只在真有引证时才出现 —— 不放半可靠的行
    rows.push(['原文', cl?(cl.q||(cl.v+' '+cl.l)):'—', true]);
    rows.push(['作品', owner.title, false, owner.file]);
    rows.push(['日期', owner.date]);
    rows.push(['追踪线', owner.beat||'未归类']);
    return rows.map(r=>{
      const val = r[3] ? `<a href="${esc(r[3])}">${esc(r[1])}</a>` : esc(r[1]);
      return `<div class="ev-row"><dt>${esc(r[0])}</dt><dd class="${r[2]?'q':''}">${val}</dd></div>`;
    }).join('');
  }
  function paint(i, animate){
    const cl=seq[i];
    const main=document.getElementById('ev-main');
    const rows=document.getElementById('ev-rows');
    const put=()=>{
      main.innerHTML=`<span class="ev-seal"><b>✓</b><span>引用已逐字回查原文</span></span>
        <div class="ev-val">${cl?esc(cl.v):'—'}</div>
        <div class="ev-label">${cl?esc(cl.l):'本篇暂无已验证断言'}</div>`;
      rows.innerHTML=rowsFor(cl, seqOwner[i]);
      const ow=seqOwner[i]||feat;
      document.getElementById('ev-serial-no').textContent=
        '№ '+ow.date.replace(/-/g,'')+'-'+String(i+1).padStart(2,'0');
      document.getElementById('ev-dots').innerHTML=seq.map((_,k)=>
        `<i class="${k===i?'on':''}"></i>`).join('');
    };
    if(!animate){ put(); return; }
    main.classList.add('out'); rows.classList.add('out');
    setTimeout(()=>{ put(); main.classList.remove('out'); rows.classList.remove('out'); }, 430);
  }
  slip.innerHTML = `
    <div class="ev-serial"><span>断言证据单 · VERIFICATION SLIP</span>
      <b id="ev-serial-no">${serial}</b>
      <span>第 ${MONTHS.length} 期 · ${esc(MONTHS.length?MONTHS[0].key:'')}</span></div>
    <div class="ev-main" id="ev-main">
      <span class="ev-seal"><b>✓</b><span>引用已逐字回查原文</span></span>
    </div>
    <dl class="ev-rows ev-swap" id="ev-rows"></dl>
    <div class="ev-foot">
      <span style="flex:1"></span>
      <span class="ev-dots" id="ev-dots"></span>
      <span class="ev-pick" id="ev-pick">${seq.length>1?'换一条 ▸':''}</span>
    </div>`;
  paint(0,false);
  // 自动轮换：封面是活的；点「换一条」也能手动切
  let timer=null;
  function startTimer(){
    if(timer) clearInterval(timer);
    if(seq.length<2) return;
    timer=setInterval(()=>{ idx=(idx+1)%seq.length; paint(idx,true); }, 7000);
  }
  startTimer();
  const pick=document.getElementById('ev-pick');
  if(pick) pick.addEventListener('click',()=>{ idx=(idx+1)%seq.length; paint(idx,true); startTimer(); });
  const sl=document.getElementById('ev-slip');
  if(sl) sl.addEventListener('mouseenter',()=>{ if(timer) clearInterval(timer); });
  if(sl) sl.addEventListener('mouseleave',startTimer);
  const tail=document.getElementById('ev-tail');
  if(tail){
    tail.innerHTML=`<p><b>按月份归档的团队档案</b> ——
      每一格是一段时间，抽出来就是那段时间团队做了什么、发现了什么。<br>
      柜子里有 <b>${c.total||0}</b> 条这样的记录，每一条都带着自己的原文、作品与日期。</p>
      <span class="ev-n"><i>${DATA.length}</i><span>件作品</span>
        <i>${MONTHS.length}</i><span>个月份</span>
        <i>${(c.dossier||[]).length}</i><span>条追踪线</span></span>`;
  }
}

// 封面数字递增（一次落定的瞬间 —— 封面唯一的"表演"）
function countUpFigs(){
  const ids=['fig-works','fig-months','fig-lines','fig-claims','cov-n'];
  ids.forEach((id,k)=>{
    const el=document.getElementById(id); if(!el) return;
    const target=parseInt(el.textContent,10); if(isNaN(target)||target===0) return;
    const dur=900, delay=420+k*90;
    setTimeout(()=>{
      const t0=performance.now();
      const step=now=>{
        const p=Math.min((now-t0)/dur,1);
        const eased=1-Math.pow(1-p,3);
        el.textContent=Math.round(target*eased).toLocaleString('en-US');
        if(p<1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }, delay);
  });
}

// 封面：期号 / 跨度 / 本期主打 / 追踪线条目 —— 全部由数据算出，随作品自动更新
function renderCover(feat){
  const c=(STATS.claims||{});
  const cn=document.getElementById('cov-n');
  if(cn) cn.textContent=c.total||0;      // countUp 依赖初值，否则永远是 0
  const dossier=c.dossier||[];
  const first=(MONTHS.length?MONTHS[MONTHS.length-1].key:'');
  const last=(MONTHS.length?MONTHS[0].key:'');
  const issue=$('#cv-issue');
  if(issue) issue.textContent='第 '+MONTHS.length+' 期';
  const sp=$('#cv-span');
  if(sp) sp.textContent=first+' — '+last;

  // 追踪线条目（像杂志的目录条）
  const cl=$('#cover-lines');
  if(cl) cl.innerHTML=dossier.slice(0,8).map(d=>`<span>${esc(d.beat)}</span>`).join('')
    + (dossier.length>8?`<span>+${dossier.length-8}</span>`:'');

  // 本期主打
  if(feat){
    const img=$('#cover-img');
    if(img && feat.thumb){ img.src=feat.thumb; img.alt=feat.title; }
    const link=$('#cover-plate-link'); if(link) link.href=feat.file;
    const tag=$('#cover-tag');
    if(tag) tag.textContent='本期主打 · '+feat.date;
    const t=$('#cover-title'); if(t) t.textContent=feat.title;
    const cl2=$('#cover-claim');
    const c0=(feat.claims&&feat.claims[0])||null;
    if(cl2) cl2.innerHTML=c0
      ? `<b>${esc(c0.v)}</b><span>${esc(c0.l)}</span>`
      : '<span>本篇暂无已验证断言</span>';
  }
  // 入场编排
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const cov=document.getElementById('cover'); if(cov) cov.classList.add('cover-in');
  }));
}

/* ── 侧标（柜脊）── */
function renderSpine(){
  const max=Math.max(1,...MONTHS.map(m=>m.items.length));
  const html=`<div class="spine-h">抽屉目录</div>`+
    MONTHS.map(m=>`
      <div class="spine-item${openSet.has(m.key)?' on':''}" data-month="${m.key}" role="button" tabindex="0">
        <span class="si-name">${esc(m.label)}</span>
        <span class="si-count">${m.items.length}</span>
      </div>`).join('')+
    `<div class="spine-foot">
       <div class="rhythm">${MONTHS.map(m=>{
          const h=Math.max(4,Math.round(m.items.length/max*34));
          const c=m.items.filter(i=>i.type==='creative').length;
          const r=m.items.length-c;
          const hc=Math.round(h*(c/m.items.length)), hr=h-hc;
          return `<i title="${esc(m.label)} · ${m.items.length} 件（研究 ${r} / 创意 ${c}）" style="height:${h}px;display:flex;flex-direction:column;justify-content:flex-end;background:none">
                   <span style="height:${hc}px;background:rgba(245,230,200,.4);border-radius:1px 1px 0 0"></span>
                   <span style="height:${hr}px;background:rgba(167,139,250,.42);border-radius:1px 1px 0 0"></span></i>`;}).join('')}</div>
       <div class="rhythm-l">${esc(MONTHS[0]?MONTHS[0].key.slice(0,7):'')} → ${esc(MONTHS.length?MONTHS[MONTHS.length-1].key.slice(0,7):'')} 产出节奏</div>
     </div>`;
  $('#spine').innerHTML=html;
  $('#spine').querySelectorAll('.spine-item').forEach(el=>{
    const act=()=>{const k=el.dataset.month; toggleMonth(k, true);};
    el.addEventListener('click',act);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
  });
}

/* ── 抽屉正面 ── */
function cardHTML(it,i){
  const c=(it.claims&&it.claims[0])||null;
  const mm=it.date.slice(5,7), dd=it.date.slice(8,10);
  const line=it.beat?`<span class="tag tag-line" data-line="${esc(it.beat)}">${hl(it.beat)}</span>`:'';
  const other=(it.tags||[]).filter(t=>t!==it.beat).slice(0,2)
    .map(t=>`<span class="tag">${hl(t)}</span>`).join('');
  return `<a class="card" href="${esc(it.file)}" style="--i:${i}">
    ${it.thumb?`<span class="card-thumb"><img src="${esc(it.thumb)}" alt="" loading="lazy" decoding="async"></span>`:
      `<span class="card-thumb"></span>`}
    <span>
      <span class="card-meta"><span>${mm}-${dd}</span><span>·</span><span>${it.type==='research'?'研究':'创意'}</span></span>
      <span class="card-title">${hl(it.title)}</span>
      <span class="card-tags">${line}${other}</span>
      ${c?`<span class="card-claim"><b>${esc(c.v)}</b><span>${hl(c.l)}</span></span>`:''}
    </span>
  </a>`;
}

function ledgerHTML(m){
  // 断言账目：把该月的**已验证断言**逐条列出（每条都带作品链接，可回原文核对）
  // 三级结构：月份（抽屉）→ 追踪线（小标题）→ 断言（行）
  // 平铺 300 条没法翻，分组后像翻账簿。
  const byLine = new Map();
  m.items.forEach(it=>{
    const line = it.beat || '未归类';
    if(!byLine.has(line)) byLine.set(line, []);
    byLine.get(line).push(it);
  });
  const lines = [...byLine.entries()].sort((a,b)=>b[1].length-a[1].length);
  let out='';
  lines.forEach(([line, its])=>{
    const n = its.reduce((a,it)=>a+(it.claims||[]).length,0);
    out += `<div class="led-sec"><span class="led-sec-n">${hl(line)}</span><span class="led-sec-c">${n} 条断言 · ${its.length} 件</span></div>`;
    its.forEach(it=>{
      const cs=it.claims||[];
      cs.forEach((c,k)=>{
        const first = k===0;
        out += `<div class="led-row${first?' led-start':' led-cont'}" data-file="${esc(it.file)}" data-c="${k}">
        <a class="led-link" href="${esc(it.file)}" title="${esc(it.title)}">
          <span class="led-v">${esc(c.v)}</span>
          <span class="led-l">${hl(c.l)}</span>
          <svg class="led-go" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17L17 7M9 7h8v8"/></svg>
        </a>
        <span class="led-d">${it.date.slice(5)}</span>
        <span class="led-w">${first?`<a href="${esc(it.file)}">${hl(it.title)}</a>`:''}</span>
      </div>`;
      });
    });
  });
  return `<div class="led">${out}</div>`;
}

function renderDrawers(){
  const host=$('#drawers');
  host.innerHTML=MONTHS.map(m=>{
    const body = MODE==='claims' ? ledgerHTML(m) : m.items.map((it,i)=>cardHTML(it,i)).join('');
    const open=openSet.has(m.key);
    return `<section class="drawer${open?' open':''}" id="dr-${esc(m.key)}" data-month="${esc(m.key)}">
      <button class="drawer-tab" aria-expanded="${open}" aria-controls="db-${esc(m.key)}">
        <span class="dt-mon">${esc(m.label)}</span>
        <span class="dt-meta"><b>${m.items.length}</b> 件 · ${esc(m.span)}</span>
        <span class="dt-meta"></span>
        <svg class="ico dt-chev" aria-hidden="true"><use href="#ico-chev"/></svg>
      </button>
      <div class="drawer-body" id="db-${esc(m.key)}">${body}</div>
    </section>`;
  }).join('');

  host.querySelectorAll('.drawer-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const sec=btn.closest('.drawer');
      toggleMonth(sec.dataset.month, false, true);
    });
  });
  host.querySelectorAll('.tag-line').forEach(t=>{
    t.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();setQuery(t.dataset.line);});
  });
}

function toggleMonth(key, fromSpine, fromTab){
  if(Q){ setQuery(''); }
  if(openSet.has(key)) openSet.delete(key); else openSet.add(key);
  const sec=document.getElementById('dr-'+key);
  if(sec){
    sec.classList.toggle('open', openSet.has(key));
    sec.querySelector('.drawer-tab').setAttribute('aria-expanded', openSet.has(key)?'true':'false');
  }
  document.querySelectorAll('.spine-item').forEach(el=>
    el.classList.toggle('on', openSet.has(el.dataset.month)));
  updateNote();
  if(fromSpine || fromTab){
    const target=document.getElementById('dr-'+key);
    if(target && openSet.has(key)){
      const y=target.getBoundingClientRect().top+window.scrollY-72;
      window.scrollTo({top:y,behavior:'smooth'});
    }
  }
}

function updateNote(){
  const n=MONTHS.reduce((a,m)=>a+m.items.length,0);
  const nc=MONTHS.reduce((a,m)=>a+m.items.reduce((b,i)=>b+(i.claims||[]).length,0),0);
  const o=openSet.size;
  $('#barnote').innerHTML = MODE==='claims'
    ? (o ? `已拉开 <b>${o}</b> 个抽屉 · 共 <b>${nc}</b> 条已验证断言`
          : `全部收起 · 共 <b>${nc}</b> 条已验证断言`)
    : (o ? `已拉开 <b>${o}</b> 个抽屉 · 共 ${n} 件`
          : `全部收起 · 共 ${n} 件`);
  $('#toggle-all').textContent = o===MONTHS.length ? '收起全部抽屉' : '展开全部抽屉';
}

/* ── 检索 ── */
function hl(s){
  if(!Q) return esc(s);
  const t=String(s==null?'':s);
  const i=t.toLowerCase().indexOf(Q.toLowerCase());
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+Q.length))+'</mark>'+esc(t.slice(i+Q.length));
}
function match(it){
  if(!Q) return true;
  const q=Q.toLowerCase();
  if(it.title.toLowerCase().includes(q)) return true;
  if((it.tags||[]).some(t=>String(t).toLowerCase().includes(q))) return true;
  if(it.beat && it.beat.toLowerCase().includes(q)) return true;
  if((it.claims||[]).some(c=>(c.v+' '+c.l).toLowerCase().includes(q))) return true;
  return false;
}
function setQuery(q){
  Q=(q||'').trim();
  const inp=$('#q'); if(inp && inp.value!==Q) inp.value=Q;
  const cab=$('#cab');
  cab.classList.toggle('searching', !!Q);
  let hits=0;
  document.querySelectorAll('.drawer').forEach(sec=>{
    let n=0;
    sec.querySelectorAll('.card, .led-row').forEach(c=>{
      const isRow=c.classList.contains('led-row');
      const it=BY_FILE[isRow?c.dataset.file:c.getAttribute('href')];
      if(!it){ c.style.display='none'; return; }
      let ok=false, shown=null;
      if(isRow){
        // 账目行按**行**匹配：该条断言命中，或该作品整体命中（标题/标签/追踪线）
        const cl=(it.claims||[])[+c.dataset.c]||null;
        const q=Q.toLowerCase();
        const rowHit=cl && (cl.v+' '+cl.l).toLowerCase().includes(q);
        const workHit=it.title.toLowerCase().includes(q)
          || (it.tags||[]).some(t=>String(t).toLowerCase().includes(q))
          || (it.beat&&it.beat.toLowerCase().includes(q));
        ok=rowHit||workHit;
        if(cl){
          c.querySelector('.led-v').textContent=cl.v;
          c.querySelector('.led-l').innerHTML=hl(cl.l);
        }
      }else{
        ok=match(it);
        if(ok){
          // 显示**被命中的那条断言**，而不是固定第一条 ——
          // 命中常在第 4+ 条（每件平均 10.8 条），显示第一条等于没命中
          const cs=it.claims||[];
          const hit=cs.find(x=>((x.v+' '+x.l).toLowerCase().includes(Q.toLowerCase())));
          shown=hit||cs[0];
          const t=c.querySelector('.card-title');
          if(t) t.innerHTML=hl(it.title);
          const vb=c.querySelector('.card-claim b');
          const cl=c.querySelector('.card-claim span');
          if(vb&&shown) vb.textContent=shown.v;
          if(cl&&shown) cl.innerHTML=hl(shown.l);
        }
      }
      c.style.display=ok?'':'none';
      if(ok)n++;
    });
    sec.classList.toggle('hit', !!Q && n>0);
    hits+=n;
  });
  $('#qhint').innerHTML = Q
    ? `命中 <b>${hits}</b> ${MODE==='claims'?'条断言':'件'}`
    : '按 <b>标题</b> / <b>标签</b> / <b>断言</b> 检索，或点左侧月份标签直接拉开抽屉';
  if(Q && !hits){
    const sec=document.querySelector('.drawer');
    if(sec && !sec.querySelector('.empty')){
      const d=document.createElement('div');
      d.className='empty';
      d.innerHTML='<b>没有命中</b>换个词试试 —— 标题、标签、断言内容都能搜';
      sec.querySelector('.drawer-body').appendChild(d);
    }
  }
  document.querySelectorAll('.drawer .empty').forEach(e=>e.remove());
}

/* ── 启动 ── */
function boot(raw){
  DATA=normalize(raw);
  ALL=DATA;                 // normalize 已按日期倒序（新的在前）
  STATS=raw.stats||{};
  BY_FILE={}; DATA.forEach(i=>BY_FILE[i.file]=i);
  // 月份分格
  const mm={};
  DATA.forEach(it=>{
    const k=it.date.slice(0,7);
    (mm[k]=mm[k]||{key:k,label:k.slice(0,4)+' 年 '+Number(k.slice(5,7))+' 月',items:[]}).items.push(it);
  });
  MONTHS=Object.values(mm).sort((a,b)=>b.key.localeCompare(a.key));
  MONTHS.forEach(m=>{const ds=m.items.map(i=>i.date).sort();m.span=ds[0].slice(5)+' → '+ds[ds.length-1].slice(5);});
  // 默认拉开最新一格
  if(MONTHS.length) openSet.add(MONTHS[0].key);
  renderFigs(); renderSpine(); renderDrawers(); updateNote();
  // 本期主打：最新月份里**有缩略图**的那件（没有缩略图会是一张空卡）
  // ⚠️ ALL 已按日期倒序，ALL[0] 就是最新的一件
  const latestMonth=ALL.length?ALL[0].date.substring(0,7):'';
  const pool=ALL.filter(i=>i.date.substring(0,7)===latestMonth);
  const feat=(pool.find(i=>i.thumb)||ALL.find(i=>i.thumb)||ALL[0])||null;
  renderCover(feat);
  buildField();
  renderFocus();
  countUpFigs();
  const q=$('#q');
  q.addEventListener('input',e=>setQuery(e.target.value));
  document.querySelectorAll('.mode-btn').forEach(b=>{
    b.addEventListener('click',()=>{
      MODE=b.dataset.mode;
      document.querySelectorAll('.mode-btn').forEach(x=>x.classList.toggle('on',x===b));
      renderDrawers();
      // 重排后恢复开合状态与高亮
      document.querySelectorAll('.drawer').forEach(sec=>{
        const on=openSet.has(sec.dataset.month);
        sec.classList.toggle('open',on);
        sec.querySelector('.drawer-tab').setAttribute('aria-expanded',on?'true':'false');
      });
      if(Q) setQuery(Q);
      updateNote();
    });
  });
  $('#toggle-all').addEventListener('click',()=>{
    if(openSet.size===MONTHS.length) openSet.clear(); else MONTHS.forEach(m=>openSet.add(m.key));
    document.querySelectorAll('.drawer').forEach(sec=>{
      const on=openSet.has(sec.dataset.month);
      sec.classList.toggle('open',on);
      sec.querySelector('.drawer-tab').setAttribute('aria-expanded',on?'true':'false');
    });
    document.querySelectorAll('.spine-item').forEach(el=>el.classList.toggle('on',openSet.has(el.dataset.month)));
    updateNote();
  });
}
fetch('manifest.json',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(j=>boot(j))
  .catch(()=>{boot(EMBEDDED);showStale();});
function showStale(){
  if(document.getElementById('stale-notice'))return;
  const n=document.createElement('div');
  n.id='stale-notice'; n.setAttribute('role','status');
  n.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;'
    +'display:flex;gap:10px;align-items:center;background:rgba(245,230,200,.09);border:1px solid rgba(245,230,200,.22);'
    +'color:#f5e6c8;font-size:12px;line-height:1.55;padding:9px 13px;border-radius:10px;'
    +'backdrop-filter:blur(8px);max-width:min(92vw,560px)';
  // 区分两种情况：file:// 是**预期降级**（浏览器禁止 fetch 本地 json），
  // HTTP 下取不到才是真故障 —— 混为一谈会让人以为系统坏了。
  const isFile = location.protocol === 'file:';
  const built = (STATS && STATS.generated) ? STATS.generated : '未知';
  // ⚠️ 三元运算符优先级坑：`isFile ? A : B + '<button>'` 会把按钮只绑到 else 分支，
  //   file:// 分支就没有 .stale-x → 下面 querySelector 返回 null → addEventListener 抛
  //   TypeError，降级提示反而整条报错。先算文案，再统一拼装。
  const msg = isFile
    ? '<span><b>离线模式</b> · file:// 下浏览器不允许读取本地 json，已回退到内置快照'
      + '（'+esc(built)+'，与磁盘一致）。要实时数据：<code>python3 tools/serve.py</code></span>'
    : '<span><b>取不到 manifest.json</b> —— 真故障（文件缺失或服务异常）。'
      + '当前是内置快照（'+esc(built)+'）。</span>';
  n.innerHTML = '<svg class="ico" aria-hidden="true"><use href="#ico-warn"/></svg>'
    + msg
    + '<button class="stale-x" aria-label="关闭提示">×</button>';
  document.body.appendChild(n);
  // 可关闭：提示是"降级说明"，不该一直挡着内容
  const x = n.querySelector('.stale-x');
  if (x) x.addEventListener('click',()=>n.remove());
}
</script>
</body>
