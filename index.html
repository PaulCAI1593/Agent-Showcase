<html lang="zh-CN">
<head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0c12'/%3E%3Crect x='8' y='9' width='16' height='4' rx='1.5' fill='%23f0c27f'/%3E%3Crect x='8' y='15' width='16' height='4' rx='1.5' fill='%23a78bfa'/%3E%3Crect x='8' y='21' width='16' height='4' rx='1.5' fill='%23ffffff' opacity='.35'/%3E%3C/svg%3E">
<style>
/* 数字与拉丁文用自托管衬线（与研究类作品页同一套字） */
@font-face{font-family:'Newsreader';src:url('assets/vendor/fonts/newsreader-latin-300-600.woff2') format('woff2');
  font-weight:300 600;font-style:normal;font-display:swap}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
.ico{width:1.05em;height:1.05em;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.13em;flex-shrink:0}
:root{
  --g0:#050508;--g1:#0b0c12;--g2:#12131a;
  --card:#0d0e14;--card-hover:#13141c;
  --glass:rgba(255,255,255,.04);--glass-h:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.06);--border-h:rgba(255,255,255,.13);
  --t1:#fafafa;--t2:rgba(255,255,255,.58);--t3:rgba(255,255,255,.46);
  --gold:#f0c27f;--gold-dim:rgba(245,230,200,.14);
  --violet:#a78bfa;--violet-dim:rgba(167,139,250,.14);
  --serif:'Noto Serif SC','Newsreader',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','PingFang SC','Microsoft YaHei',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
html{scroll-behavior:smooth;background:var(--g0);-webkit-text-size-adjust:100%}
body{font-family:var(--sans);color:var(--t1);background:var(--g0);
  -webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.6}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:4px}

/* ══ 柜面 ══════════════════════════════════════════════ */
.cab-face{
  position:relative;padding:96px 28px 56px;overflow:hidden;
  background:radial-gradient(ellipse 110% 70% at 22% -10%,rgba(245,230,200,.07) 0%,transparent 58%),
             radial-gradient(ellipse 70% 60% at 88% 12%,rgba(167,139,250,.07) 0%,transparent 55%),var(--g0);
  border-bottom:1px solid var(--border);
}
.cab-face-inner{max-width:1240px;margin:0 auto}
.cab-title{font-family:var(--serif);font-size:clamp(38px,5.4vw,64px);font-weight:700;line-height:1.1;
  letter-spacing:-.022em;margin:0}
.cab-title em{font-style:normal;color:var(--gold)}
.cab-lede{margin-top:18px;font-size:16.5px;line-height:1.72;color:var(--t2);max-width:58ch}
.cab-top{display:flex;gap:40px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-top:38px}
.cab-figs{display:flex;gap:34px;flex-wrap:wrap}
.fig-n{font-family:var(--serif);font-size:34px;font-weight:600;color:var(--gold);line-height:1.05;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.fig-l{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);margin-top:5px}

/* 搜索：档案柜的主控制 */
.search{position:relative;flex:1 1 320px;max-width:420px;min-width:260px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
.search input{
  width:100%;padding:13px 15px 13px 44px;border-radius:11px;
  background:var(--glass);border:1px solid var(--border);color:var(--t1);
  font-family:var(--sans);font-size:15px;transition:border-color .2s,background .2s;
}
.search input::placeholder{color:var(--t3)}
.search input:focus{outline:none;border-color:var(--border-h);background:var(--glass-h)}
.search-hint{font-size:12px;color:var(--t3);margin-top:8px;min-height:16px}
.search-hint b{color:var(--gold);font-weight:500}

/* ══ 柜体 ══════════════════════════════════════════════ */
.cab{display:grid;grid-template-columns:236px minmax(0,1fr);gap:0;max-width:1240px;margin:0 auto;
  border-left:1px solid var(--border);border-right:1px solid var(--border)}
/* 侧标（柜脊） */
.spine{border-right:1px solid var(--border);padding:30px 0 44px;position:sticky;top:0;align-self:start;
  max-height:100vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
.spine-h{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--t3);padding:0 22px 12px}
.spine-item{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  padding:8px 22px;cursor:pointer;border-left:2px solid transparent;transition:background .18s,border-color .18s}
.spine-item:hover{background:var(--glass)}
.spine-item.on{border-left-color:var(--gold);background:var(--glass)}
.spine-item .si-name{font-size:13.5px;color:var(--t2);transition:color .18s;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.spine-item.on .si-name,.spine-item:hover .si-name{color:var(--t1)}
.spine-item .si-count{font-family:var(--serif);font-size:12.5px;color:var(--t3);font-variant-numeric:tabular-nums}
.spine-item.on .si-count{color:var(--gold)}
.spine-foot{margin:26px 22px 0;padding-top:18px;border-top:1px solid var(--border)}
.rhythm{display:flex;align-items:flex-end;gap:4px;height:34px;margin-bottom:10px}
.rhythm i{flex:1;background:rgba(167,139,250,.34);border-radius:1px 1px 0 0;min-height:2px}
.rhythm i.c{background:rgba(245,230,200,.34)}
.rhythm-l{font-size:11.5px;color:var(--t3);font-family:var(--serif);letter-spacing:.04em}

/* 抽屉正面 */
.drawers{padding:30px 34px 90px;min-width:0}
.drawer{border-bottom:1px solid var(--border);scroll-margin-top:64px}
.drawer:last-child{border-bottom:0}
.drawer-tab{
  width:100%;display:grid;grid-template-columns:auto 1fr auto auto;gap:16px;align-items:baseline;
  padding:17px 4px;background:none;border:0;color:inherit;cursor:pointer;text-align:left;
  font-family:inherit;transition:padding .3s var(--ease);
}
.drawer-tab:hover .dt-name{color:var(--gold)}
.drawer.open .drawer-tab{padding-bottom:13px}
.dt-mon{font-family:var(--serif);font-size:23px;font-weight:600;letter-spacing:-.012em;color:var(--t1);
  font-variant-numeric:tabular-nums;transition:color .25s}
.drawer.open .dt-mon{color:var(--gold)}
.dt-meta{font-size:12.5px;color:var(--t3);font-family:var(--serif)}
.dt-meta b{color:var(--t2);font-weight:400}
.dt-chev{color:var(--t3);transition:transform .45s var(--ease);align-self:center}
.drawer.open .dt-chev{transform:rotate(180deg);color:var(--t1)}
/* 抽屉拉出：透视 + 旋转 + 高度 —— 一套连贯动作 */
.drawer-body{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:13px;
  overflow:hidden;max-height:0;opacity:0;padding-top:0;
  transform-origin:top center;perspective:1400px;
  transform:perspective(1400px) rotateX(-7deg) translateY(-14px) scaleY(.97);
  transition:max-height .62s var(--ease),opacity .34s ease,padding-top .5s var(--ease),
             transform .58s var(--ease);
}
.drawer.open .drawer-body{max-height:5200px;opacity:1;padding-top:6px;transform:none}
/* 卡片落位：错峰 18ms，跟着抽屉一起完成 */
.card{
  display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;align-items:start;
  padding:13px;border:1px solid var(--border);border-radius:12px;background:var(--card);
  transition:border-color .22s,background .22s,transform .22s var(--ease);
  opacity:0;transform:translateY(12px);
}
.drawer.open .card{opacity:1;transform:none;transition:opacity .42s var(--ease) calc(var(--i)*18ms),
  transform .42s var(--ease) calc(var(--i)*18ms),border-color .22s,background .22s}
.card:hover{border-color:var(--border-h);background:var(--card-hover);transform:translateY(-2px)}
.drawer.open .card:hover{transform:translateY(-2px)}
.card-thumb{width:104px;aspect-ratio:16/10;border-radius:7px;overflow:hidden;background:var(--g2);
  display:block;flex-shrink:0}
.card-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3);
  font-family:var(--serif);font-variant-numeric:tabular-nums}
.card-title{font-family:var(--serif);font-size:15px;line-height:1.42;font-weight:600;margin-top:6px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
.tag{font-size:11.5px;padding:2px 7px;border-radius:980px;border:1px solid var(--border);
  color:var(--t3);line-height:1.5;white-space:nowrap;cursor:pointer;transition:border-color .2s,color .2s}
.tag:hover{border-color:var(--border-h);color:var(--t2)}
.tag-line{border-color:var(--violet-dim);color:var(--violet)}
.tag-line:hover{color:#c4b1ff}
.card-claim{margin-top:10px;padding-top:9px;border-top:1px solid var(--border);
  font-size:12.5px;color:var(--t3);display:flex;gap:7px;align-items:baseline}
.card-claim b{font-family:var(--serif);font-size:13.5px;color:var(--gold);font-weight:600;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.card-claim span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
mark{background:rgba(240,194,127,.2);color:var(--gold);border-radius:2px;padding:0 1px}

/* 搜索命中态 */
.cab.searching .drawer:not(.hit){display:none}
.cab.searching .drawer.hit .drawer-body{max-height:5200px;opacity:1;padding-top:6px;transform:none}
.cab.searching .drawer.hit .card{opacity:1;transform:none}
.empty{grid-column:1/-1;padding:56px 20px;text-align:center;color:var(--t3);font-size:14px}
.empty b{display:block;font-family:var(--serif);font-size:19px;color:var(--t2);margin-bottom:8px;font-weight:600}

/* 工具条 */
.cab-bar{display:flex;align-items:center;gap:14px;padding:16px 34px;border-bottom:1px solid var(--border);
  position:sticky;top:0;background:rgba(5,5,8,.9);backdrop-filter:blur(12px);z-index:20;flex-wrap:wrap}
.bar-btn{font-family:var(--sans);font-size:12.5px;color:var(--t2);background:var(--glass);
  border:1px solid var(--border);border-radius:980px;padding:6px 14px;cursor:pointer;transition:.2s}
.bar-btn:hover{background:var(--glass-h);border-color:var(--border-h);color:var(--t1)}
.bar-note{font-size:12px;color:var(--t3);font-family:var(--serif)}
.bar-note b{color:var(--gold);font-weight:500}

/* 页脚 */
.foot{border-top:1px solid var(--border);padding:40px 28px 54px}
.foot-inner{max-width:1240px;margin:0 auto;display:flex;gap:30px;justify-content:space-between;
  flex-wrap:wrap;align-items:baseline}
.foot p{font-size:12.5px;color:var(--t3);line-height:1.7;max-width:60ch}
.foot .foot-n{font-family:var(--serif);font-size:12.5px;color:var(--t3);white-space:nowrap}

@media(max-width:1000px){
  .cab{grid-template-columns:1fr;border:0}
  .spine{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--border);
    display:flex;gap:6px;overflow-x:auto;padding:14px 22px;scrollbar-width:none}
  .spine::-webkit-scrollbar{display:none}
  .spine-h,.spine-foot{display:none}
  .spine-item{border-left:0;border-bottom:2px solid transparent;padding:7px 13px;white-space:nowrap;
    background:var(--glass);border-radius:8px}
  .spine-item.on{border-left:0;border-bottom-color:var(--gold)}
  .spine-item .si-name{white-space:nowrap}
  .drawers{padding:24px 22px 70px}
  .cab-bar{padding:12px 22px}
}
@media(max-width:700px){
  .cab-face{padding:56px 20px 40px}
  .cab-top{gap:22px}
  .fig-n{font-size:27px}
  .drawer-body{grid-template-columns:1fr}
  .card{grid-template-columns:88px minmax(0,1fr)}
  .card-thumb{width:88px}
  .dt-mon{font-size:19px}
  .drawer-tab{grid-template-columns:auto 1fr auto;gap:10px}
  .dt-meta{grid-column:2}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
  .card{opacity:1;transform:none}
  .drawer-body{transform:none}
}
</style>

</header>

<!-- ══ 柜体 ══════════════════════════════════════════════ -->
<div class="cab-bar">

<script>
/* ══════════════════════════════════════════════════════════
   档案柜 —— 按月份归档，抽屉可拉开
   数据全部来自 manifest.json（运行时 fetch），file:// 回退到内嵌快照
   ══════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let DATA=[], STATS={}, BY_FILE={}, MONTHS=[], openSet=new Set(), Q='';

function normalize(src){
  const out=[];
  for(const g of ['research','creative']){
    for(const it of (src[g]||[])){
      out.push({
        file:it.file, thumb:it.thumb||'', title:it.title||'', date:it.date||'',
        type:it.type||g, tags:it.highlights||it.tags||[], desc:it.description||it.desc||'',
        beat:it.beat||'', claims:it.claims||[]
      });
    }
  }
  return out.sort((a,b)=>b.date.localeCompare(a.date));
}

/* ── 柜面数字 ── */
function renderFigs(){
  const c=(STATS.claims||{});
  $('#fig-works').textContent=DATA.length;
  $('#fig-months').textContent=MONTHS.length;
  $('#fig-lines').textContent=(c.dossier||[]).length;
  $('#fig-claims').textContent=c.total||0;
  const f=$('#foot-date'); if(f) f.textContent=STATS.generated?('更新于 '+STATS.generated):'';
}

/* ── 侧标（柜脊）── */
function renderSpine(){
  const max=Math.max(1,...MONTHS.map(m=>m.items.length));
  const html=`<div class="spine-h">抽屉目录</div>`+
    MONTHS.map(m=>`
      <div class="spine-item${openSet.has(m.key)?' on':''}" data-month="${m.key}" role="button" tabindex="0">
        <span class="si-name">${esc(m.label)}</span>
        <span class="si-count">${m.items.length}</span>
      </div>`).join('')+
    `<div class="spine-foot">
       <div class="rhythm">${MONTHS.map(m=>{
          const h=Math.max(4,Math.round(m.items.length/max*34));
          const c=m.items.filter(i=>i.type==='creative').length;
          const r=m.items.length-c;
          const hc=Math.round(h*(c/m.items.length)), hr=h-hc;
          return `<i title="${esc(m.label)} · ${m.items.length} 件（研究 ${r} / 创意 ${c}）" style="height:${h}px;display:flex;flex-direction:column;justify-content:flex-end;background:none">
                   <span style="height:${hc}px;background:rgba(245,230,200,.4);border-radius:1px 1px 0 0"></span>
                   <span style="height:${hr}px;background:rgba(167,139,250,.42);border-radius:1px 1px 0 0"></span></i>`;}).join('')}</div>
       <div class="rhythm-l">${esc(MONTHS[0]?MONTHS[0].key.slice(0,7):'')} → ${esc(MONTHS.length?MONTHS[MONTHS.length-1].key.slice(0,7):'')} 产出节奏</div>
     </div>`;
  $('#spine').innerHTML=html;
  $('#spine').querySelectorAll('.spine-item').forEach(el=>{
    const act=()=>{const k=el.dataset.month; toggleMonth(k, true);};
    el.addEventListener('click',act);
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}});
  });
}

/* ── 抽屉正面 ── */
function cardHTML(it,i){
  const c=(it.claims&&it.claims[0])||null;
  const mm=it.date.slice(5,7), dd=it.date.slice(8,10);
  const line=it.beat?`<span class="tag tag-line" data-line="${esc(it.beat)}">${hl(it.beat)}</span>`:'';
  const other=(it.tags||[]).filter(t=>t!==it.beat).slice(0,2)
    .map(t=>`<span class="tag">${hl(t)}</span>`).join('');
  return `<a class="card" href="${esc(it.file)}" style="--i:${i}">
    ${it.thumb?`<span class="card-thumb"><img src="${esc(it.thumb)}" alt="" loading="lazy" decoding="async"></span>`:
      `<span class="card-thumb"></span>`}
    <span>
      <span class="card-meta"><span>${mm}-${dd}</span><span>·</span><span>${it.type==='research'?'研究':'创意'}</span></span>
      <span class="card-title">${hl(it.title)}</span>
      <span class="card-tags">${line}${other}</span>
      ${c?`<span class="card-claim"><b>${esc(c.v)}</b><span>${hl(c.l)}</span></span>`:''}
    </span>
  </a>`;
}

function renderDrawers(){
  const host=$('#drawers');
  host.innerHTML=MONTHS.map(m=>{
    const cards=m.items.map((it,i)=>cardHTML(it,i)).join('');
    const open=openSet.has(m.key);
    return `<section class="drawer${open?' open':''}" id="dr-${esc(m.key)}" data-month="${esc(m.key)}">
      <button class="drawer-tab" aria-expanded="${open}" aria-controls="db-${esc(m.key)}">
        <span class="dt-mon">${esc(m.label)}</span>
        <span class="dt-meta"><b>${m.items.length}</b> 件 · ${esc(m.span)}</span>
        <span class="dt-meta"></span>
        <svg class="ico dt-chev" aria-hidden="true"><use href="#ico-chev"/></svg>
      </button>
      <div class="drawer-body" id="db-${esc(m.key)}">${cards}</div>
    </section>`;
  }).join('');

  host.querySelectorAll('.drawer-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const sec=btn.closest('.drawer');
      toggleMonth(sec.dataset.month, false, true);
    });
  });
  host.querySelectorAll('.tag-line').forEach(t=>{
    t.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();setQuery(t.dataset.line);});
  });
}

function toggleMonth(key, fromSpine, fromTab){
  if(Q){ setQuery(''); }
  if(openSet.has(key)) openSet.delete(key); else openSet.add(key);
  const sec=document.getElementById('dr-'+key);
  if(sec){
    sec.classList.toggle('open', openSet.has(key));
    sec.querySelector('.drawer-tab').setAttribute('aria-expanded', openSet.has(key)?'true':'false');
  }
  document.querySelectorAll('.spine-item').forEach(el=>
    el.classList.toggle('on', openSet.has(el.dataset.month)));
  updateNote();
  if(fromSpine || fromTab){
    const target=document.getElementById('dr-'+key);
    if(target && openSet.has(key)){
      const y=target.getBoundingClientRect().top+window.scrollY-72;
      window.scrollTo({top:y,behavior:'smooth'});
    }
  }
}

function updateNote(){
  const n=MONTHS.reduce((a,m)=>a+m.items.length,0);
  const o=openSet.size;
  $('#barnote').innerHTML = o
    ? `已拉开 <b>${o}</b> 个抽屉 · 共 ${n} 件`
    : `全部收起 · 共 ${n} 件`;
  $('#toggle-all').textContent = o===MONTHS.length ? '收起全部抽屉' : '展开全部抽屉';
}

/* ── 检索 ── */
function hl(s){
  if(!Q) return esc(s);
  const t=String(s==null?'':s);
  const i=t.toLowerCase().indexOf(Q.toLowerCase());
  if(i<0) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+Q.length))+'</mark>'+esc(t.slice(i+Q.length));
}
function match(it){
  if(!Q) return true;
  const q=Q.toLowerCase();
  if(it.title.toLowerCase().includes(q)) return true;
  if((it.tags||[]).some(t=>String(t).toLowerCase().includes(q))) return true;
  if(it.beat && it.beat.toLowerCase().includes(q)) return true;
  if((it.claims||[]).some(c=>(c.v+' '+c.l).toLowerCase().includes(q))) return true;
  return false;
}
function setQuery(q){
  Q=(q||'').trim();
  const inp=$('#q'); if(inp && inp.value!==Q) inp.value=Q;
  const cab=$('#cab');
  cab.classList.toggle('searching', !!Q);
  let hits=0;
  document.querySelectorAll('.drawer').forEach(sec=>{
    let n=0;
    sec.querySelectorAll('.card').forEach(c=>{
      const it=BY_FILE[c.getAttribute('href')];
      const ok=!it?false:match(it);
      c.style.display=ok?'':'none';
      if(ok){
        n++;
        // 检索后才需要高亮 —— 渲染时还不知道查询词
        const t=c.querySelector('.card-title');
        if(t) t.innerHTML=hl(it.title);
        const cl=c.querySelector('.card-claim span');
        if(cl && it.claims && it.claims[0]) cl.innerHTML=hl(it.claims[0].l);
      }
    });
    sec.classList.toggle('hit', !!Q && n>0);
    hits+=n;
  });
  $('#qhint').innerHTML = Q
    ? `命中 <b>${hits}</b> 件`
    : '按 <b>标题</b> / <b>标签</b> / <b>断言</b> 检索，或点左侧月份标签直接拉开抽屉';
  if(Q && !hits){
    const sec=document.querySelector('.drawer');
    if(sec && !sec.querySelector('.empty')){
      const d=document.createElement('div');
      d.className='empty';
      d.innerHTML='<b>没有命中</b>换个词试试 —— 标题、标签、断言内容都能搜';
      sec.querySelector('.drawer-body').appendChild(d);
    }
  }
  document.querySelectorAll('.drawer .empty').forEach(e=>e.remove());
}

/* ── 启动 ── */
function boot(raw){
  DATA=normalize(raw);
  STATS=raw.stats||{};
  BY_FILE={}; DATA.forEach(i=>BY_FILE[i.file]=i);
  // 月份分格
  const mm={};
  DATA.forEach(it=>{
    const k=it.date.slice(0,7);
    (mm[k]=mm[k]||{key:k,label:k.slice(0,4)+' 年 '+Number(k.slice(5,7))+' 月',items:[]}).items.push(it);
  });
  MONTHS=Object.values(mm).sort((a,b)=>b.key.localeCompare(a.key));
  MONTHS.forEach(m=>{const ds=m.items.map(i=>i.date).sort();m.span=ds[0].slice(5)+' → '+ds[ds.length-1].slice(5);});
  // 默认拉开最新一格
  if(MONTHS.length) openSet.add(MONTHS[0].key);
  renderFigs(); renderSpine(); renderDrawers(); updateNote();
  const q=$('#q');
  q.addEventListener('input',e=>setQuery(e.target.value));
  $('#toggle-all').addEventListener('click',()=>{
    if(openSet.size===MONTHS.length) openSet.clear(); else MONTHS.forEach(m=>openSet.add(m.key));
    document.querySelectorAll('.drawer').forEach(sec=>{
      const on=openSet.has(sec.dataset.month);
      sec.classList.toggle('open',on);
      sec.querySelector('.drawer-tab').setAttribute('aria-expanded',on?'true':'false');
    });
    document.querySelectorAll('.spine-item').forEach(el=>el.classList.toggle('on',openSet.has(el.dataset.month)));
    updateNote();
  });
}
fetch('manifest.json',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(j=>boot(j))
  .catch(()=>{boot(EMBEDDED);showStale();});
function showStale(){
  if(document.getElementById('stale-notice'))return;
  const n=document.createElement('div');
  n.id='stale-notice'; n.setAttribute('role','status');
  n.style.cssText='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:99;'
    +'display:flex;gap:9px;align-items:center;background:rgba(245,230,200,.09);border:1px solid rgba(245,230,200,.22);'
    +'color:#f5e6c8;font-size:12.5px;padding:10px 16px;border-radius:10px;backdrop-filter:blur(8px)';
