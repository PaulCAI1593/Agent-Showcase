<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>智囊团展厅</title>
<!-- 自托管中文衬线（按 unicode-range 分片，浏览器只下载用到的片；
     取自 fonts.loli.net 镜像，国内可达；离线亦可用） -->
<link rel="stylesheet" href="assets/vendor/fonts/noto-serif-sc.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0c12'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23f0c27f'/%3E%3C/svg%3E">
<style>
/* 数字与拉丁文用自托管衬线（与研究类作品页同一套字） */
@font-face{font-family:'Newsreader';src:url('assets/vendor/fonts/newsreader-latin-300-600.woff2') format('woff2');
  font-weight:300 600;font-style:normal;font-display:swap}
.ico{width:1.05em;height:1.05em;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;vertical-align:-.13em;flex-shrink:0}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --g0:#050508;--g1:#0b0c12;--g2:#12131a;
  --card:#0d0e14;--card-hover:#13141c;
  --glass:rgba(255,255,255,.04);--glass-h:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.06);--border-h:rgba(255,255,255,.12);
  --t1:#fafafa;--t2:rgba(255,255,255,.56);--t3:rgba(255,255,255,.48);
  --gold:#f5e6c8;--gold-dim:rgba(245,230,200,.15);
  --accent:#f0c27f;--accent2:#a78bfa;
  --r-c:rgba(167,139,250,.10);--r-b:rgba(167,139,250,.22);
  --c-c:rgba(251,191,36,.10);--c-b:rgba(251,191,36,.22);
  --serif:'Noto Serif SC','Newsreader',Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Noto Sans SC",sans-serif;
}
html{background:var(--g0)}
body{font-family:var(--sans);color:var(--t1);background:var(--g0);-webkit-font-smoothing:antialiased;min-height:100vh}
.hero{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 24px;background:radial-gradient(ellipse 120% 80% at 50% 0%,rgba(167,139,250,.06) 0%,transparent 60%),radial-gradient(ellipse 80% 60% at 80% 50%,rgba(245,230,200,.04) 0%,transparent 50%),var(--g0)}
.hero-inner{max-width:960px;width:100%}
.hero-title{font-family:var(--serif);font-size:clamp(40px,7vw,72px);font-weight:700;line-height:1.08;letter-spacing:-0.02em;margin-bottom:20px}
.hero-title span{color:var(--gold)}
.hero-subtitle{font-size:clamp(16px,2.5vw,20px);color:var(--t2);line-height:1.75;max-width:560px;margin-top:24px;margin-bottom:44px}
.stats{display:flex;gap:32px;flex-wrap:wrap;margin-bottom:32px}
.stat{text-align:center}
.stat-num{font-family:var(--serif);font-size:44px;font-weight:700;color:var(--gold);line-height:1.1;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.stat-label{font-size:12px;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px}
.featured-card{display:flex;align-items:center;gap:20px;padding:20px 24px;background:var(--glass);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:12px;text-decoration:none;color:inherit;transition:all .25s ease}
.featured-card:hover{background:var(--glass-h);border-color:var(--border-h);transform:translateX(4px)}
.featured-icon{flex-shrink:0;color:var(--gold);line-height:0;display:flex}
.featured-text{flex:1}
.featured-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--t3);margin-bottom:4px}
.featured-title{font-size:15px;font-weight:500;color:var(--t1);line-height:1.4}
.hero-meta{margin-top:40px;padding-top:20px;border-top:1px solid var(--border);display:flex;gap:24px;flex-wrap:wrap;font-size:12px;color:var(--t3)}
.hero-meta a{color:var(--accent);text-decoration:none}
.hero-meta a:hover{text-decoration:underline}
/* ── HORIZONTAL TIMELINE ── */
.timeline{padding:48px 24px 32px;border-top:1px solid var(--border)}
.timeline-inner{max-width:1120px;margin:0 auto}
.timeline-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.timeline-title{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--t1)}
.timeline-hint{font-size:12px;color:var(--t2);margin-left:auto;display:flex;align-items:center;gap:4px}
.timeline-scroll{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.timeline-scroll::-webkit-scrollbar{height:4px}
.timeline-scroll::-webkit-scrollbar-track{background:transparent}
.timeline-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.tl-card{flex:0 0 auto;width:220px;padding:14px 16px;background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:10px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start;transition:all .2s;cursor:pointer}
.tl-card:hover{background:var(--card-hover);border-color:var(--border-h);transform:translateY(-1px)}
.tl-card-tag{font-size:10px;width:fit-content;padding:2px 7px;border-radius:980px;display:inline-flex;align-items:center;gap:4px}
.tl-card-tag.research{background:var(--r-c);color:var(--accent2)}
.tl-card-tag.creative{background:var(--c-c);color:var(--accent)}
.tl-card-date{font-size:11px;color:var(--t3);letter-spacing:.5px}
.tl-card-title{font-size:14px;font-weight:500;line-height:1.5;color:var(--t1);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.filter-bar{position:sticky;top:0;z-index:100;padding:12px 24px;background:rgba(5,5,8,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.filter-inner{max-width:1120px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filter-btn{padding:6px 14px;border-radius:980px;border:1px solid var(--border);background:transparent;color:var(--t2);font-size:13px;font-family:var(--sans);cursor:pointer;transition:all .2s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.filter-btn:hover{border-color:var(--border-h);color:var(--t1)}
.filter-btn.active{background:var(--glass-h);border-color:var(--border-h);color:var(--t1)}
.filter-btn.active[data-filter="research"]{border-color:var(--r-b);color:var(--accent2)}
.filter-btn.active[data-filter="creative"]{border-color:var(--c-b);color:var(--accent)}
.filter-sep{width:1px;height:20px;background:var(--border);margin:0 4px;flex-shrink:0}
.filter-btn.tag-btn{font-size:12px;padding:4px 10px;color:var(--t3)}
.filter-btn.tag-btn.active{color:var(--t1)}
.section{padding:64px 24px 48px}
.section:last-child{padding-bottom:80px}
.section-inner{max-width:1120px;margin:0 auto}
.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.section-title{font-family:var(--serif);font-size:22px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.section-count{font-size:13px;color:var(--t3)}
.section-divider{width:100%;height:1px;background:var(--border);margin-bottom:24px}
.pill-row{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.pill-row::-webkit-scrollbar{display:none}
.month-pill{flex:0 0 auto}
.year-row{display:flex;gap:6px;margin-bottom:10px}
.year-pill{font:600 11px/1 var(--sans);letter-spacing:.6px;padding:5px 10px;border-radius:980px;
  border:1px solid var(--border);background:transparent;color:var(--t3);cursor:pointer}
.year-pill.active{color:var(--gold);border-color:var(--accent);background:var(--gold-dim)}
.month-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:28px;margin-bottom:16px}
.month-pill{padding:5px 12px;border-radius:980px;border:1px solid var(--border);background:transparent;color:var(--t2);font-size:13px;font-family:var(--sans);cursor:pointer;transition:all .2s;white-space:nowrap}
.month-pill:hover{border-color:var(--border-h);color:var(--t1)}
.month-pill.active{background:var(--glass-h);border-color:var(--border-h);color:var(--t1);font-weight:500}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.bento-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:all .3s ease}
.bento-card:hover{background:var(--card-hover);border-color:var(--border-h);transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.25)}
.card-thumb-wrap{position:relative;width:100%;padding-top:62%;background:var(--g2);overflow:hidden}
.card-thumb-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.bento-card:hover .card-thumb-wrap img{transform:scale(1.03)}
.card-badge{position:absolute;top:10px;left:10px;padding:3px 10px;border-radius:980px;font-size:11px;font-weight:500;letter-spacing:.5px}
.card-badge.research{background:var(--r-c);color:var(--accent2);border:1px solid var(--r-b)}
.card-badge.creative{background:var(--c-c);color:var(--accent);border:1px solid var(--c-b)}
.card-body{padding:16px 18px 18px;display:flex;flex-direction:column;flex:1}
.card-date{font-size:11px;color:var(--t3);letter-spacing:.8px;margin-bottom:6px}
.card-title{font-size:14px;font-weight:500;line-height:1.45;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-desc{font-size:12px;color:var(--t3);line-height:1.5;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.month-expand{display:none;margin-top:16px;padding:16px;background:var(--glass);border:1px solid var(--border);border-radius:12px}
.month-expand.open{display:block}
.month-expand-inner{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.month-card{display:flex;gap:12px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;text-decoration:none;color:inherit;transition:all .2s;min-width:0}
.month-card:hover{background:var(--card-hover);border-color:var(--border-h)}
.month-card-thumb{width:80px;height:52px;border-radius:6px;overflow:hidden;flex-shrink:0;background:var(--g2)}
.month-card-thumb img{width:100%;height:100%;object-fit:cover}
.month-card-info{flex:1;min-width:0}
.month-card-title{font-size:13px;font-weight:500;line-height:1.35;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.month-card-meta{font-size:12px;color:var(--t3);display:flex;gap:10px;align-items:center;margin-top:2px;letter-spacing:.3px}
.month-card-tag{padding:2px 7px;border-radius:980px;font-size:10px}
.month-card-tag.research{background:var(--r-c);color:var(--accent2)}
.month-card-tag.creative{background:var(--c-c);color:var(--accent)}
.footer{padding:24px 24px 32px;text-align:center;border-top:1px solid var(--border);font-size:12px;color:var(--t3);letter-spacing:.3px}
.reveal-init{opacity:0;transform:translateY(16px);transition:opacity .5s ease,transform .5s ease}
.reveal-init.revealed{opacity:1;transform:translateY(0)}
@media(max-width:768px){.filter-inner{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}.filter-inner::-webkit-scrollbar{display:none}.filter-btn{flex:0 0 auto}#tagFilterHost{display:flex;gap:8px;flex:0 0 auto}.filter-sep{display:none}.bento{grid-template-columns:1fr}.month-expand-inner{grid-template-columns:1fr}.stats{gap:20px}.stat-num{font-size:32px}.month-card{flex-direction:column;align-items:stretch}.month-card-thumb{width:100%;height:100px}.hero{min-height:auto;padding:60px 24px}}
@media(min-width:769px) and (max-width:1024px){.bento{grid-template-columns:repeat(2,1fr)}}

/* ── Coverage：追踪台（首页主叙事，尺寸与作品总量无关）── */
.coverage{padding:56px 24px 8px;border-top:1px solid var(--border)}
.cov-inner{max-width:1120px;margin:0 auto}
.cov-kicker{font-family:var(--sans);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--t3);margin-bottom:18px}
.cov-lede{font-family:var(--serif);font-size:clamp(19px,2.6vw,27px);line-height:1.55;
  font-weight:400;color:var(--t1);max-width:34em;margin-bottom:44px}
.cov-lede em{font-style:normal;color:var(--accent)}
.cov-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:52px;align-items:start}
@media(max-width:900px){.cov-grid{grid-template-columns:1fr;gap:40px}.beats{grid-template-columns:1fr}}
.cov-h{font-family:var(--sans);font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--t3);padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:18px}
/* 月度节奏 */
.rhythm{display:flex;align-items:flex-end;gap:14px;height:132px}
.ry{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;min-width:0}
.ry-bar{display:flex;flex-direction:column-reverse;width:100%;border-radius:3px 3px 0 0;overflow:hidden}
.ry-r{background:var(--r-b)}.ry-c{background:var(--c-b)}
.ry-n{font-family:var(--serif);font-size:15px;color:var(--t2);text-align:center}
.ry-m{font-family:var(--sans);font-size:10px;color:var(--t3);text-align:center;letter-spacing:.4px}
.ry-peak .ry-n{color:var(--accent)}
.rhythm-legend{display:flex;gap:16px;margin-top:14px;font-size:11px;color:var(--t3)}
.rhythm-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
/* 协作 */
.collab-stat{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.collab-num{font-family:var(--serif);font-size:52px;line-height:1;color:var(--gold)}
.collab-unit{font-size:13px;color:var(--t3)}
.collab-sub{font-size:12px;color:var(--t3);margin-bottom:20px}
.pairs{list-style:none;display:flex;flex-direction:column;gap:9px}
.pairs li{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--t2)}
.pairs b{font-weight:500;color:var(--t1)}
.pairs .bar{flex:1;height:1px;background:var(--border);position:relative}
.pairs .n{font-family:var(--serif);color:var(--t3);font-size:12px;min-width:2.2em;text-align:right}
/* 产能矩阵 */
.cap{margin-top:44px}
.cov-grid-2{margin-top:52px}
.cap-row{display:grid;grid-template-columns:5.5em 1fr 3em;gap:12px;align-items:center;
  padding:7px 0;border-bottom:1px solid var(--border)}
.cap-a{font-size:12px;color:var(--t2)}
.cap-bars{display:flex;gap:3px;align-items:flex-end;height:22px}
.cap-c{font-family:var(--serif);font-size:12px;color:var(--t3);text-align:right}
.cap-cell{flex:1;background:rgba(167,139,250,.42);border-radius:1px;min-height:2px}
.cap-cell.zero{background:rgba(255,255,255,.07);min-height:2px}
.cap-note{font-size:11px;color:var(--t3);margin-top:10px}
/* 追踪线 */
.beats{margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:0 32px}
.beat{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.beat-name{color:var(--t1)}
.beat-span{font-family:var(--serif);color:var(--t3);font-size:12px}
.beat-w{font-family:var(--serif);color:var(--t2);font-size:13px;min-width:2.4em;text-align:right}
.beat-idle{color:var(--accent);font-size:11px}
.uncl{font-size:11px;color:var(--t3);margin-top:14px;line-height:1.7}
.uncl b{color:var(--t2);font-weight:500}


/* ── 卷宗：追踪线 × 已验证断言 ───────────────────────── */
.dossier{padding:76px 24px 92px;background:var(--g1);border-top:1px solid var(--border)}
.dossier-inner{max-width:1120px;margin:0 auto}
.dossier-title{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-0.01em}
.dossier-sub{font-size:12px;color:var(--t3);font-family:var(--serif);letter-spacing:1.4px;text-transform:uppercase}
.dossier-lede{font-size:14px;color:var(--t2);line-height:1.75;max-width:780px;margin:10px 0 30px}
.dossier-lede em{color:var(--gold);font-style:normal;font-family:var(--serif);font-size:15px}
.dc{border-top:1px solid var(--border)}
.dc:last-child{border-bottom:1px solid var(--border)}
.dc summary{list-style:none;cursor:pointer;display:grid;
  grid-template-columns:minmax(9em,1.05fr) 1fr auto;gap:18px;align-items:baseline;
  padding:15px 6px;transition:background .18s ease}
.dc summary::-webkit-details-marker{display:none}
.dc summary:hover{background:rgba(255,255,255,.022)}
.dc-beat{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--t1)}
.dc-meta{font-size:12px;color:var(--t3);font-family:var(--serif)}
.dc-n{font-family:var(--serif);font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.dc-n small{color:var(--t3);font-size:11px;margin-left:5px}
.dc-ch{list-style:none;margin:0 0 20px;padding:0;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(316px,1fr));gap:8px}
.dc-ch li{display:grid;grid-template-columns:46px 1fr;gap:4px 10px;align-items:baseline;
  padding:10px 13px;background:var(--glass);border:1px solid var(--border);border-radius:9px}
.dc-d{font-family:var(--serif);font-size:11px;color:var(--t3);font-variant-numeric:tabular-nums}
.dc-t{font-size:12.5px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc-t a{color:var(--t2);text-decoration:none}
.dc-t a:hover{color:var(--gold)}
.dc-claim{grid-column:2;display:flex;gap:8px;align-items:baseline;margin-top:3px}
.dc-v{font-family:var(--serif);font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.dc-l{font-size:11.5px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc-none{font-size:11.5px;color:var(--t3);grid-column:2;font-style:normal}
@media(max-width:760px){
  .dc summary{grid-template-columns:1fr auto}
  .dc-meta{grid-column:1/-1;grid-row:2}
  .dc-ch{grid-template-columns:1fr}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute;overflow:hidden" aria-hidden="true" focusable="false">
<symbol id="ico-research" viewBox="0 0 24 24"><path d="M3 20.5h18M6.5 20.5V11M12 20.5V4.5M17.5 20.5v-6"/></symbol>
<symbol id="ico-creative" viewBox="0 0 24 24"><path d="M12 3.2l1.85 4.6 4.6 1.85-4.6 1.85L12 16.1l-1.85-4.6-4.6-1.85 4.6-1.85z"/><path d="M18.5 15.5l.75 1.85 1.85.75-1.85.75-.75 1.85-.75-1.85-1.85-.75 1.85-.75z"/></symbol>
<symbol id="ico-timeline" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3.2v3.6M16 3.2v3.6"/></symbol>
<symbol id="ico-warn" viewBox="0 0 24 24"><path d="M12 3.6l9 15.9H3z"/><path d="M12 9.6v4.4M12 16.6v.1"/></symbol>
</svg>
<section class="hero">
<div class="hero-inner">
  <h1 class="hero-title">以研究为刃<span>以创意为光</span></h1>
  <p class="hero-subtitle">从AI产业的资本暗流到技术前沿的算力博弈，每一次交付都是团队协作的结晶，每一份洞察都在重新定义可能性的边界。</p>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="stat-total" data-target="0">0</div><div class="stat-label">作品</div></div>
    <div class="stat"><div class="stat-num" id="stat-research" data-target="0">0</div><div class="stat-label">研究</div></div>
    <div class="stat"><div class="stat-num" id="stat-creative" data-target="0">0</div><div class="stat-label">创意</div></div>

// ── Normalize: manifest.json is authoritative; enrich with legacy tag/desc ──
function normalize(src){
  const out={research:[],creative:[]};
  // 标签/描述单一来源：manifest.highlights/description（EMBEDDED 用同名，
  // 旧快照的 desc/tags 仍兼容读取）。已废弃的 TAGMAP 不再引用。
  const descOf = it => it.description || it.desc || '';
  const tagsOf = it => it.highlights || it.tags || [];
  for(const g of ['research','creative']){
    for(const it of (src[g]||[])){
      out[g].push({
        file:it.file,
        thumb:it.thumb||'',
        title:it.title||'',
        date:it.date||'',
        type:it.type||g,
        tags:tagsOf(it),
        desc:descOf(it)
      });
    }
  }
  out.__stats = src.stats || {};
  return out;
}

  const pool=ALL.filter(i=>i.date.substring(0,7)===latestMonth);
  const feat=pool.find(i=>i.thumb)||ALL.find(i=>i.thumb)||ALL[0];
  const fc=document.getElementById('featured-card'), ft=document.getElementById('featured-title');
  if(fc&&feat){fc.href=feat.file; ft.textContent=feat.title;}
  STATS=data.__stats||{};
  renderCoverage();
  renderDossier();
  renderTagFilters();
  renderTimeline();
  applyFilter('all',null);
  animateStats();
  const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('revealed');obs.unobserve(e.target)}})},{threshold:0.1});
  document.querySelectorAll('.reveal-init').forEach(el=>obs.observe(el));
}

fetch('manifest.json',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(j=>boot(normalize(j)))
  .catch(()=>{boot(normalize(EMBEDDED));showStaleNotice();});

// 回退到内嵌快照时必须让观看者知道：快照是构建时冻结的，可能已过期。
// 之前这里静默降级，展厅可以连续数周显示旧数据而无人察觉。
function showStaleNotice(){
  if(document.getElementById('stale-notice'))return;
  const n=document.createElement('div');
  n.id='stale-notice';
  n.setAttribute('role','status');
  n.innerHTML='<svg class=\'ico\'><use href=\'#ico-warn\'/></svg> 未能读取 manifest.json，当前显示的是内置快照，可能不是最新。';
  n.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:9999;'+
    'padding:10px 16px;border-radius:10px;font:500 13px/1.4 var(--sans);color:#f5e6c8;'+
    'background:rgba(20,14,4,.92);border:1px solid rgba(240,194,127,.45);'+
    'box-shadow:0 8px 24px rgba(0,0,0,.45);max-width:min(92vw,560px);text-align:center';
  document.body.appendChild(n);
}


// ── Tag filters: generated from data (no more hand-written dead buttons) ──
function renderTagFilters(){
  const host=document.getElementById('tagFilterHost');
  if(!host)return;
  const counts={};
  for(const i of ALL) for(const t of (i.tags||[])) counts[t]=(counts[t]||0)+1;
  // keep only tags with >=2 works, then top 10 by frequency
  const tags=Object.entries(counts).filter(([,n])=>n>=2)
    .sort((a,b)=>b[1]-a[1]).slice(0,10).map(([t])=>t);
  if(!tags.length){host.innerHTML='';return;}
  host.innerHTML=tags.map(t=>`<button class="filter-btn tag-btn" data-tag="${esc(t)}">${esc(t)}</button>`).join('');
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}


// ── Coverage：全部从 manifest.stats 读，尺寸与作品总量无关 ──
let STATS={};
function renderCoverage(){
  const st=STATS; if(!st||!st.span)return;
  const m=st.span.last.slice(0,7);
  document.getElementById('cov-kicker').textContent=
    `第 ${st.span.months} 期 · ${st.span.first.slice(0,4)} 年卷 · ${st.span.last}`;

  const peak=st.rhythm.reduce((a,b)=>b.works>a.works?b:a,st.rhythm[0]);
  const perMonth=(st.collab.total/st.span.months).toFixed(1);
  document.getElementById('cov-lede').innerHTML=
    `${st.span.months} 个月，<em>${st.collab.total}</em> 件作品，平均每月 ${perMonth} 件 —— `+
    `其中 <em>${st.collab.rate}%</em> 由多个 Agent 合著。`+
    `产出峰值在 ${peak.month}（${peak.works} 件）。`;

  // 节奏条
  const maxW=Math.max(...st.rhythm.map(r=>r.works))||1;
  document.getElementById('rhythm').innerHTML=st.rhythm.map(r=>{
    const h=Math.round(r.works/maxW*88);
    const rh=Math.round(r.research/maxW*88), ch=Math.round(r.creative/maxW*88);
    return `<div class="ry${r.month===peak.month?' ry-peak':''}">
      <div class="ry-n">${r.works}</div>
      <div class="ry-bar" style="height:${h}px">
        <div class="ry-r" style="height:${rh}px"></div>
        <div class="ry-c" style="height:${ch}px"></div>
      </div>
      <div class="ry-m">${r.month.slice(5)}</div></div>`;}).join('');

  // 协作
  const top=st.collab.edges[0];
  document.getElementById('collab').innerHTML=
    `<div class="collab-stat"><span class="collab-num">${st.collab.rate}%</span>
       <span class="collab-unit">合著率</span></div>
     <div class="collab-sub">${st.collab.joint} 件合著 · ${st.collab.solo} 件独立完成</div>
     <ul class="pairs">${st.collab.edges.slice(0,6).map(e=>
       `<li><b>${esc(e.a)}</b><span>+</span><b>${esc(e.b)}</b>
        <span class="bar"></span><span class="n">${e.works}</span></li>`).join('')}</ul>`;

  // 产能矩阵
  const cap=st.capacity, cmax=Math.max(...cap.rows.flatMap(r=>r.by_month))||1;
  document.getElementById('capacity').innerHTML=cap.rows.map(r=>
    `<div class="cap-row"><span class="cap-a">${esc(r.agent)}</span>
      <span class="cap-bars">${r.by_month.map(v=>
        `<span class="cap-cell${v?'':' zero'}" style="height:${v?Math.max(3,Math.round(v/cmax*22)):2}px"
          title="${esc(cap.months[r.by_month.indexOf(v)]||'')} ${v} 件"></span>`).join('')}</span>
      <span class="cap-c">${r.total}</span></div>`).join('')
    +`<div class="cap-note">按 ${esc(cap.months[0]).slice(5)}–${esc(cap.months[cap.months.length-1]).slice(5)} 排列，柱高=当月主责件数</div>`;

  // 追踪线
  document.getElementById('beats').innerHTML=st.beats.map(b=>
    `<div class="beat"><span class="beat-name">${esc(b.name)}</span>
      <span class="beat-span">跨 ${b.months} 月${b.weeks_idle>=4?` · <span class="beat-idle">闲置 ${b.weeks_idle} 周</span>`:''}</span>
      <span class="beat-w">${b.works}</span></div>`).join('');

  const u=st.unclassified_tags||[];
  document.getElementById('unclassified').innerHTML= u.length
    ? `尚未归入追踪线的标签：<b>${u.slice(0,8).map(x=>esc(x.tag)).join('、')}</b>
       <br>若其中出现新主题，请在 <code>tools/build_manifest.py</code> 的 BEAT_FAMILIES 增补。`
    : '';
}


// ── 卷宗：追踪线 × 已验证断言 ──
let BY_FILE={};
function renderDossier(){
  const host=document.getElementById('dossier');
  if(!host)return;
  const c=STATS.claims;
  if(!c||!c.dossier||!c.dossier.length){host.innerHTML='';return;}
  const lede=document.getElementById('dossier-lede');
  if(lede) lede.innerHTML=
    `${c.dossier.length} 条追踪线，<em>${c.total}</em> 条断言的引用都逐字回查过原文`+
    `—— 覆盖 ${c.works_covered}/${c.works_total} 件作品（${c.coverage}%）。`+
    ` 另有 ${c.pending} 条候选未通过校验，<b>不进卷宗</b>：宁可少一条，不放一条假的。`;
  host.innerHTML=c.dossier.map((d,i)=>{
    const items=d.chapters.map(ch=>{
      const meta=BY_FILE[ch.file]||{};
      const date=(ch.file.match(/(\d{4})-(\d{2})-(\d{2})/)||[]);
      const md=date[2]&&date[3]?`${date[2]}-${date[3]}`:'';
      const t=esc(meta.title||ch.file);
      const claim=ch.v
        ? `<span class="dc-v">${esc(ch.v)}</span><span class="dc-l">${esc(ch.l||'')}</span>`
        : `<span class="dc-none">无已验证断言</span>`;
      return `<li><span class="dc-d">${md}</span>`+
        `<span class="dc-t"><a href="${esc(ch.file)}">${t}</a></span>`+
        `<span class="dc-claim">${claim}</span></li>`;
    }).join('');
    const open=i===0?' open':'';
    return `<details class="dc"${open}><summary>`+
      `<span class="dc-beat">${esc(d.beat)}</span>`+
      `<span class="dc-meta">${d.works} 件 · ${d.first.slice(0,7)} → ${d.last.slice(0,7)}</span>`+
      `<span class="dc-n">${d.claims} 条断言<small>${d.works} 篇</small></span>`+
      `</summary><ul class="dc-ch">${items}</ul></details>`;
  }).join('');
}
// ── Timeline: all works, newest first ──
function renderTimeline(){
  const el=document.querySelector('.timeline-scroll');
  if(!el)return;
  // 时间线必须与页面上其它区块遵守同一个筛选状态，
  // 否则同一次点击会在同一页给出两个矛盾答案。
  let f=ALL;
  if(curFilter!=='all') f=f.filter(i=>i.type===curFilter);
  if(curTag) f=f.filter(i=>i.tags&&i.tags.includes(curTag));
  el.innerHTML=f.length?f.map(i=>`<a class="tl-card" href="${esc(i.file)}"><span class="tl-card-date">${esc(i.date)}</span><span class="tl-card-tag ${i.type}">${i.type==='research'?'<svg class=\'ico\'><use href=\'#ico-research\'/></svg>研究':'<svg class=\'ico\'><use href=\'#ico-creative\'/></svg>创意'}</span><span class="tl-card-title">${esc(i.title)}</span></a>`).join('')
    :'<div class="tl-empty">该筛选下暂无作品 · 点「全部」回到完整时间线</div>';
  // 计数如实反映当前是否被筛选，不再一律自称「全部」
  const hint=document.getElementById('timeline-hint');
  if(hint) hint.textContent=f.length===ALL.length
      ? `← 横向滚动查看全部 ${ALL.length} 件 ›`
      : `已筛选 ${f.length} / ${ALL.length} 件 · 点「全部」看完整时间线`;
}

// ── Bento: always latest 3, ignoring month filter ──
function renderBento(id,items,filter,tagFilter){
  const el=document.getElementById(id);
  let f=items;
  if(filter!=='all') f=f.filter(i=>i.type===filter);
  if(tagFilter) f=f.filter(i=>i.tags&&i.tags.includes(tagFilter));
  f=f.slice().sort((a,b)=>b.date.localeCompare(a.date));
  el.innerHTML=f.slice(0,3).map(i=>`<a class="bento-card" href="${esc(i.file)}"><div class="card-thumb-wrap">${i.thumb?`<img src="${esc(i.thumb)}" alt="${esc(i.title)}" loading="lazy" decoding="async">`:''}<span class="card-badge ${i.type}">${i.type==='research'?'<svg class=\'ico\'><use href=\'#ico-research\'/></svg>研究':'<svg class=\'ico\'><use href=\'#ico-creative\'/></svg>创意'}</span></div><div class="card-body"><div class="card-date">${esc(i.date)}</div><div class="card-title">${esc(i.title)}</div><div class="card-desc">${esc(i.desc||'查看详情 →')}</div></div></a>`).join('');
  el.querySelectorAll('.bento-card').forEach(c=>{c.classList.add('reveal-init');setTimeout(()=>c.classList.add('revealed'),100)});
}

// ── 月份导航按年分组（>12 个月才启用；纯函数便于单测）──
const PILLS_YEAR_THRESHOLD=12;
function groupMonthsByYear(sorted, threshold){
  const th = threshold==null ? PILLS_YEAR_THRESHOLD : threshold;
  // 内部自行排序：不依赖调用方传入顺序，否则调用点一改就静默把最老年份当最新
  const ms = sorted.slice().sort().reverse();
  if(ms.length<=th) return {grouped:false, years:[], visible:ms, selected:null};
  const years=[]; const byYear={};
  ms.forEach(m=>{const y=m.slice(0,4); if(!byYear[y]){byYear[y]=[];years.push(y);} byYear[y].push(m);});
  const sel=years[0];
  return {grouped:true, years, byYear, selected:sel, visible:byYear[sel]||[]};
}

// ── Monthly: controlled by month pills ──
function renderMonthly(cid,pid,items,filter,tagFilter){
  let f=items;
  if(filter!=='all') f=f.filter(i=>i.type===filter);
  if(tagFilter) f=f.filter(i=>i.tags&&i.tags.includes(tagFilter));
  const months={};f.forEach(i=>{const ym=i.date.substring(0,7);(months[ym]=months[ym]||[]).push(i)});
  const sorted=Object.keys(months).sort().reverse();
  const grp=groupMonthsByYear(sorted);
  const pillHost=document.getElementById(pid);
  const yearBar=grp.grouped
    ? `<div class="year-row">${grp.years.map(y=>`<button class="year-pill${y===grp.selected?' active':''}" data-year="${y}">${y}</button>`).join('')}</div>`
    : '';
  pillHost.innerHTML=yearBar+`<div class="pill-row">`+grp.visible.map((m,i)=>`<button class="month-pill${i===0?' active':''}" data-month="${m}">${m}</button>`).join('')+`</div>`;
  document.getElementById(cid).innerHTML=sorted.map((m,i)=>`<div class="month-expand${i===0?' open':''}" data-month="${m}"><div class="month-expand-inner">${months[m].map(i=>`<a class="month-card" href="${esc(i.file)}"><div class="month-card-thumb">${i.thumb?`<img src="${esc(i.thumb)}" alt="${esc(i.title)}" loading="lazy" decoding="async">`:''}</div><div class="month-card-info"><div class="month-card-title">${esc(i.title)}</div><div class="month-card-meta"><span class="month-card-tag ${i.type}">${i.type==='research'?'<svg class=\'ico\'><use href=\'#ico-research\'/></svg>':'<svg class=\'ico\'><use href=\'#ico-creative\'/></svg>'}</span><span>${i.date}</span></div></div></a>`).join('')}</div></div>`).join('');
  document.getElementById(pid).querySelectorAll('.month-pill').forEach(btn=>{btn.addEventListener('click',()=>{
    document.getElementById(pid).querySelectorAll('.month-pill').forEach(b=>b.classList.remove('active'));btn.classList.add('active');
    document.getElementById(cid).querySelectorAll('.month-expand').forEach(e=>e.classList.toggle('open',e.dataset.month===btn.dataset.month));
  })});
}

// ── Filter state ──
let curFilter='all', curTag=null;

function applyFilter(filter,tag){
  curFilter=filter; curTag=tag||null;
  // Bento always shows latest 3
  renderBento('research-bento',DATA.research,filter,curTag);
  renderBento('creative-bento',DATA.creative,filter,curTag);
  // Monthly list responds to month pills
  renderMonthly('research-monthly','research-pills',DATA.research,filter,curTag);
  renderMonthly('creative-monthly','creative-pills',DATA.creative,filter,curTag);
  // Timeline shares the same filter state (was: ignored it entirely)
  renderTimeline();
  // Counts
  let allItems=ALL;
  if(filter!=='all') allItems=allItems.filter(i=>i.type===filter);
  if(curTag) allItems=allItems.filter(i=>i.tags&&i.tags.includes(curTag));
  const rc=allItems.filter(i=>i.type==='research').length;
  const cc=allItems.filter(i=>i.type==='creative').length;
  document.getElementById('research-count').textContent=rc+' 份';
  document.getElementById('creative-count').textContent=cc+' 件';
  // Hide empty sections
  document.getElementById('research-section').style.display=rc===0?'none':'';
  document.getElementById('creative-section').style.display=cc===0?'none':'';
}

// ── Filter click ──
document.getElementById('filterBar').addEventListener('click',e=>{
  const btn=e.target.closest('.filter-btn');if(!btn)return;
  // Type filter (全部/研究/创意)
  if(btn.dataset.filter){
    document.querySelectorAll('.filter-btn[data-filter]').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.filter-btn.tag-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    applyFilter(btn.dataset.filter,null);
  }
  // Tag filter
  if(btn.dataset.tag){
    const tag=btn.dataset.tag;
    if(curTag===tag){btn.classList.remove('active');curTag=null;}
    else{
      document.querySelectorAll('.filter-btn.tag-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      curTag=tag;
    }
    applyFilter(curFilter,curTag);
  }
});

// ── Hero stat animation ──
function animateStats(){document.querySelectorAll('.stat-num[data-target]').forEach(el=>{const target=parseInt(el.dataset.target);if(isNaN(target)||target===0){el.textContent='0';return}const duration=1200;const start=performance.now();function step(now){const p=Math.min((now-start)/duration,1);const ease=1-Math.pow(1-p,3);el.textContent=Math.round(target*ease);if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)})}

</script>
